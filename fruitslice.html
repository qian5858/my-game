<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>切水果</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a1a;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Segoe UI',sans-serif;color:#e0e0e0;user-select:none;overflow:hidden}
.header{display:flex;gap:12px;margin-bottom:6px;font-size:.9rem;flex-wrap:wrap;justify-content:center}
.header .item{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.06);padding:5px 14px;border-radius:20px}
.header .val{font-weight:bold;color:#feca57;min-width:28px;text-align:center}
.canvas-wrap{border:2px solid #2a2a4a;border-radius:10px;overflow:hidden;box-shadow:0 0 30px rgba(255,107,107,.08);position:relative}
canvas{display:block;cursor:none}
.overlay{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.6);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10}
.overlay h2{font-size:1.6rem;margin-bottom:8px;color:#feca57}
.overlay p{color:#aab;margin-bottom:12px}
.overlay .btn{padding:10px 28px;border:none;border-radius:10px;font-size:1rem;font-weight:bold;cursor:pointer;background:linear-gradient(135deg,#48dbfb,#0abde3);color:#0a1628}
.tip{margin-top:4px;font-size:.7rem;color:#445}
</style>
</head>
<body>
<div class="header">
  <div class="item">🏅 分数 <span class="val" id="score">0</span></div>
  <div class="item">🏆 最高 <span class="val" id="best">0</span></div>
  <div class="item">🔥 连击 <span class="val" id="combo">0</span></div>
  <div class="item">❤️ 生命 <span class="val" id="lives">3</span></div>
</div>
<div class="canvas-wrap">
  <canvas id="cv" width="500" height="450"></canvas>
  <div class="overlay" id="overlay">
    <h2 id="ov-title">🍉 切水果</h2>
    <p id="ov-msg">划动鼠标切开水果，避开炸弹！</p>
    <button class="btn" onclick="startGame()">开始切！</button>
  </div>
</div>
<div class="tip">按住鼠标拖动切割 · 切到炸弹扣命 · 连切加分</div>

<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const W=500,H=450;

const FRUITS=[
  {emoji:'🍉',name:'西瓜',color:'#e74c3c',juice:'#ff6b6b',points:1,r:28},
  {emoji:'🍊',name:'橘子',color:'#e67e22',juice:'#f39c12',points:1,r:22},
  {emoji:'🍋',name:'柠檬',color:'#f1c40f',juice:'#feca57',points:1,r:20},
  {emoji:'🍎',name:'苹果',color:'#c0392b',juice:'#e74c3c',points:1,r:24},
  {emoji:'🍇',name:'葡萄',color:'#8e44ad',juice:'#9b59b6',points:2,r:20},
  {emoji:'🍑',name:'桃子',color:'#fd79a8',juice:'#ff9ff3',points:2,r:24},
  {emoji:'🍍',name:'菠萝',color:'#f39c12',juice:'#f1c40f',points:3,r:30},
  {emoji:'🥝',name:'猕猴桃',color:'#27ae60',juice:'#2ecc71',points:2,r:22},
];

let fruits,bombs,slashes,juiceParticles,score,best,combo,comboTimer,lives,gameRunning,gameOver;
let mouseDown=false,mouseX=0,mouseY=0,prevMX=0,prevMY=0;
let spawnTimer,frame;

best=parseInt(localStorage.getItem('fruit_best')||'0');
document.getElementById('best').textContent=best;

function startGame(){
  fruits=[];bombs=[];slashes=[];juiceParticles=[];
  score=0;combo=0;comboTimer=0;lives=3;
  gameRunning=true;gameOver=false;spawnTimer=0;frame=0;
  document.getElementById('overlay').style.display='none';
  updateUI();
}

function spawnFruit(){
  const type=FRUITS[Math.floor(Math.random()*FRUITS.length)];
  const side=Math.random();
  let x,vx;
  if(side<0.5){x=-20;vx=3+Math.random()*3;}
  else{x=W+20;vx=-(3+Math.random()*3);}
  fruits.push({
    x,y:H+20,
    vx,vy:-(10+Math.random()*4),
    r:type.r,rotation:Math.random()*Math.PI*2,rotSpeed:(Math.random()-0.5)*0.1,
    ...type,sliced:false,
  });
}

function spawnBomb(){
  const x=50+Math.random()*(W-100);
  bombs.push({
    x,y:H+20,vx:(Math.random()-0.5)*3,vy:-(9+Math.random()*3),
    r:22,rotation:0,rotSpeed:(Math.random()-0.5)*0.05,
  });
}

function sliceFruit(fruit,sx,sy,ex,ey){
  fruit.sliced=true;
  combo++;comboTimer=60;
  const pts=fruit.points*(combo>1?combo:1);
  score+=pts;

  // Juice particles
  for(let i=0;i<12;i++){
    const angle=Math.random()*Math.PI*2;
    const speed=2+Math.random()*5;
    juiceParticles.push({
      x:fruit.x,y:fruit.y,
      vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,
      r:2+Math.random()*4,life:25+Math.random()*15,
      color:fruit.juice,
    });
  }

  // Slice trail
  slashes.push({x1:sx,y1:sy,x2:ex,y2:ey,life:8});

  // Floating score
  juiceParticles.push({
    x:fruit.x,y:fruit.y-10,vx:0,vy:-1.5,
    r:0,life:40,color:'#feca57',text:`+${pts}`,
  });
}

function updateUI(){
  document.getElementById('score').textContent=score;
  document.getElementById('combo').textContent=combo>1?combo+'x':'0';
  document.getElementById('lives').textContent='❤️'.repeat(lives);
}

function update(){
  if(!gameRunning)return;
  frame++;
  spawnTimer++;

  // Spawn rate increases
  const rate=Math.max(20,60-score/10);
  if(spawnTimer>=rate){spawnTimer=0;spawnFruit();if(Math.random()<0.15)spawnBomb();}

  // Combo timer
  if(comboTimer>0)comboTimer--;
  else combo=0;

  // Update fruits
  for(let i=fruits.length-1;i>=0;i--){
    const f=fruits[i];
    f.x+=f.vx;f.y+=f.vy;f.vy+=0.25;f.rotation+=f.rotSpeed;
    if(f.sliced||f.y>H+50){
      if(!f.sliced&&f.y>H+50){lives--;if(lives<=0)endGame();}
      fruits.splice(i,1);
    }
  }

  // Update bombs
  for(let i=bombs.length-1;i>=0;i--){
    const b=bombs[i];
    b.x+=b.vx;b.y+=b.vy;b.vy+=0.25;b.rotation+=b.rotSpeed;
    if(b.y>H+50){bombs.splice(i,1);continue;}
    // Check slice
    if(mouseDown&&Math.hypot(mouseX-b.x,mouseY-b.y)<b.r+10){
      lives--;bombs.splice(i,1);
      // Explosion particles
      for(let j=0;j<15;j++){
        const angle=Math.random()*Math.PI*2;
        juiceParticles.push({x:b.x,y:b.y,vx:Math.cos(angle)*5,vy:Math.sin(angle)*5,r:3+Math.random()*3,life:20,color:'#333'});
      }
      if(lives<=0)endGame();
    }
  }

  // Check fruit slicing
  if(mouseDown){
    fruits.forEach(f=>{
      if(f.sliced)return;
      // Line-circle intersection
      const dx=f.x-mouseX,dy=f.y-mouseY;
      if(Math.hypot(dx,dy)<f.r+5){
        sliceFruit(f,prevMX,prevMY,mouseX,mouseY);
      }
    });
  }

  // Update particles
  for(let i=juiceParticles.length-1;i>=0;i--){
    const p=juiceParticles[i];
    p.x+=p.vx;p.y+=p.vy;
    if(!p.text)p.vy+=0.1;
    p.life--;
    if(p.life<=0)juiceParticles.splice(i,1);
  }

  // Update slashes
  for(let i=slashes.length-1;i>=0;i--){
    slashes[i].life--;
    if(slashes[i].life<=0)slashes.splice(i,1);
  }

  updateUI();
}

function endGame(){
  gameRunning=false;gameOver=true;
  if(score>best){best=score;localStorage.setItem('fruit_best',best);document.getElementById('best').textContent=best;}
  document.getElementById('ov-title').textContent='Game Over';
  document.getElementById('ov-msg').textContent=`得分: ${score} · 最高连击: ${combo}`;
  document.getElementById('overlay').style.display='flex';
}

function draw(){
  ctx.fillStyle='#0d1117';ctx.fillRect(0,0,W,H);

  // Background pattern
  ctx.fillStyle='rgba(255,255,255,.01)';
  for(let x=0;x<W;x+=30)for(let y=0;y<H;y+=30){
    if((x+y)%60===0)ctx.fillRect(x,y,15,15);
  }

  // Slash trails
  slashes.forEach(s=>{
    ctx.strokeStyle=`rgba(255,255,255,${s.life/8})`;
    ctx.lineWidth=3;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(s.x1,s.y1);ctx.lineTo(s.x2,s.y2);ctx.stroke();
    // Glow
    ctx.strokeStyle=`rgba(72,219,251,${s.life/16})`;
    ctx.lineWidth=8;
    ctx.beginPath();ctx.moveTo(s.x1,s.y1);ctx.lineTo(s.x2,s.y2);ctx.stroke();
  });

  // Fruits
  fruits.forEach(f=>{
    if(f.sliced)return;
    ctx.save();ctx.translate(f.x,f.y);ctx.rotate(f.rotation);
    // Shadow
    ctx.fillStyle='rgba(0,0,0,.2)';
    ctx.beginPath();ctx.ellipse(3,3,f.r,f.r*0.8,0,0,Math.PI*2);ctx.fill();
    // Body
    const grad=ctx.createRadialGradient(-f.r*0.2,-f.r*0.2,f.r*0.1,0,0,f.r);
    grad.addColorStop(0,f.color+'cc');grad.addColorStop(1,f.color);
    ctx.fillStyle=grad;
    ctx.beginPath();ctx.arc(0,0,f.r,0,Math.PI*2);ctx.fill();
    // Highlight
    ctx.fillStyle='rgba(255,255,255,.25)';
    ctx.beginPath();ctx.ellipse(-f.r*0.2,-f.r*0.3,f.r*0.35,f.r*0.2,-0.3,0,Math.PI*2);ctx.fill();
    // Emoji
    ctx.font=`${f.r*1.2}px serif`;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(f.emoji,0,2);
    ctx.restore();
  });

  // Bombs
  bombs.forEach(b=>{
    ctx.save();ctx.translate(b.x,b.y);ctx.rotate(b.rotation);
    ctx.fillStyle='#2c3e50';
    ctx.beginPath();ctx.arc(0,0,b.r,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#34495e';
    ctx.beginPath();ctx.arc(-3,-3,b.r*0.6,0,Math.PI*2);ctx.fill();
    // Fuse
    ctx.strokeStyle='#e67e22';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(0,-b.r);ctx.quadraticCurveTo(5,-b.r-8,10,-b.r-5);ctx.stroke();
    // Spark
    ctx.fillStyle='#f1c40f';
    ctx.beginPath();ctx.arc(10,-b.r-5,3+Math.sin(frame*0.3)*1.5,0,Math.PI*2);ctx.fill();
    // Skull
    ctx.font=`${b.r}px serif`;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('💣',0,2);
    ctx.restore();
  });

  // Juice particles
  juiceParticles.forEach(p=>{
    ctx.globalAlpha=p.life/30;
    if(p.text){
      ctx.font='bold 16px sans-serif';ctx.textAlign='center';ctx.fillStyle=p.color;
      ctx.fillText(p.text,p.x,p.y);
    }else{
      ctx.fillStyle=p.color;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
    }
    ctx.globalAlpha=1;
  });

  // Cursor blade
  if(mouseDown){
    ctx.strokeStyle='rgba(72,219,251,.6)';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(mouseX,mouseY,12,0,Math.PI*2);ctx.stroke();
    ctx.strokeStyle='rgba(72,219,251,.3)';ctx.lineWidth=1;
    ctx.beginPath();ctx.arc(mouseX,mouseY,18,0,Math.PI*2);ctx.stroke();
  }

  // Combo display
  if(combo>1){
    ctx.font=`bold ${20+combo*2}px sans-serif`;ctx.textAlign='center';
    ctx.fillStyle=`rgba(254,202,87,${comboTimer/60})`;
    ctx.fillText(`${combo}x COMBO!`,W/2,60);
  }
}

function gameLoop(){
  update();draw();
  requestAnimationFrame(gameLoop);
}

// Input
cv.addEventListener('mousedown',e=>{mouseDown=true;const r=cv.getBoundingClientRect();mouseX=e.clientX-r.left;mouseY=e.clientY-r.top;prevMX=mouseX;prevMY=mouseY;});
cv.addEventListener('mousemove',e=>{const r=cv.getBoundingClientRect();prevMX=mouseX;prevMY=mouseY;mouseX=e.clientX-r.left;mouseY=e.clientY-r.top;});
cv.addEventListener('mouseup',()=>mouseDown=false);
cv.addEventListener('mouseleave',()=>mouseDown=false);

cv.addEventListener('touchstart',e=>{e.preventDefault();mouseDown=true;const r=cv.getBoundingClientRect();mouseX=e.touches[0].clientX-r.left;mouseY=e.touches[0].clientY-r.top;prevMX=mouseX;prevMY=mouseY;},{passive:false});
cv.addEventListener('touchmove',e=>{e.preventDefault();const r=cv.getBoundingClientRect();prevMX=mouseX;prevMY=mouseY;mouseX=e.touches[0].clientX-r.left;mouseY=e.touches[0].clientY-r.top;},{passive:false});
cv.addEventListener('touchend',e=>{e.preventDefault();mouseDown=false;},{passive:false});

gameRunning=false;gameOver=true;
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
