<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>谁是卧底</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; font-family: 'Segoe UI', sans-serif;
    color: #e0e0e0; user-select: none; padding: 20px;
  }
  h1 {
    font-size: 1.8rem; margin-bottom: 16px; letter-spacing: 4px;
    background: linear-gradient(90deg, #ff6b6b, #feca57, #48dbfb);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }

  /* 通用卡片 */
  .card {
    background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1);
    border-radius: 16px; padding: 24px 28px; width: 100%; max-width: 420px;
    margin-bottom: 14px; backdrop-filter: blur(6px);
  }
  .card h3 { font-size: 1.1rem; color: #feca57; margin-bottom: 12px; }

  /* 设置区 */
  .setting-row {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 12px;
  }
  .setting-row label { font-size: .95rem; color: #aab; }
  .setting-row .ctrl { display: flex; align-items: center; gap: 8px; }
  .ctrl button {
    width: 32px; height: 32px; border-radius: 50%; border: 1px solid rgba(255,255,255,.2);
    background: rgba(255,255,255,.08); color: #fff; font-size: 1.1rem;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .ctrl button:hover { background: rgba(255,255,255,.15); }
  .ctrl .num { font-size: 1.2rem; font-weight: bold; color: #feca57; min-width: 24px; text-align: center; }

  /* 名字输入 */
  .name-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
  .name-input {
    display: flex; align-items: center; gap: 8px;
  }
  .name-input span { color: #889; font-size: .85rem; min-width: 24px; }
  .name-input input {
    flex: 1; padding: 8px 12px; border-radius: 8px;
    border: 1px solid rgba(255,255,255,.15); background: rgba(255,255,255,.06);
    color: #e0e0e0; font-size: .95rem; outline: none;
  }
  .name-input input:focus { border-color: #48dbfb; }

  /* 按钮 */
  .btn {
    padding: 12px 32px; border: none; border-radius: 12px;
    font-size: 1rem; font-weight: bold; cursor: pointer;
    transition: transform .2s; font-family: inherit;
  }
  .btn:hover { transform: scale(1.04); }
  .btn-primary {
    background: linear-gradient(135deg, #48dbfb, #0abde3);
    color: #0a1628;
  }
  .btn-danger {
    background: linear-gradient(135deg, #ff6b6b, #ee5a24);
    color: #fff;
  }
  .btn-success {
    background: linear-gradient(135deg, #2ecc71, #27ae60);
    color: #fff;
  }
  .btn-group { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 12px; }

  /* 看词阶段 */
  .word-reveal {
    text-align: center; padding: 20px;
  }
  .word-reveal .player-name {
    font-size: 1.3rem; color: #48dbfb; margin-bottom: 16px;
  }
  .word-card {
    background: linear-gradient(135deg, #1a2a4a, #2a3a5a);
    border: 2px solid rgba(72,219,251,.3); border-radius: 16px;
    padding: 28px 40px; margin: 16px auto; display: inline-block;
    min-width: 200px; box-shadow: 0 0 30px rgba(72,219,251,.1);
  }
  .word-card .word {
    font-size: 2rem; font-weight: bold; color: #feca57;
    letter-spacing: 4px;
  }
  .word-card.hidden-word .word {
    filter: blur(12px); user-select: none;
  }
  .word-hint { color: #889; font-size: .85rem; margin-top: 12px; }

  /* 描述阶段 */
  .turn-info {
    text-align: center; margin-bottom: 16px;
  }
  .turn-info .current { font-size: 1.2rem; color: #48dbfb; }
  .turn-info .desc-prompt { color: #889; font-size: .85rem; margin-top: 6px; }

  .player-status {
    display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 12px;
  }
  .player-tag {
    padding: 5px 14px; border-radius: 20px; font-size: .85rem;
    border: 1px solid rgba(255,255,255,.15); background: rgba(255,255,255,.05);
  }
  .player-tag.active { border-color: #48dbfb; background: rgba(72,219,251,.15); color: #48dbfb; }
  .player-tag.eliminated { opacity: .3; text-decoration: line-through; }
  .player-tag.voted { border-color: #ff6b6b; background: rgba(255,107,107,.15); color: #ff6b6b; }

  /* 投票 */
  .vote-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 0;
  }
  .vote-btn {
    padding: 10px; border-radius: 10px; border: 1px solid rgba(255,255,255,.15);
    background: rgba(255,255,255,.05); color: #e0e0e0; font-size: .95rem;
    cursor: pointer; transition: all .2s; font-family: inherit;
  }
  .vote-btn:hover { border-color: #ff6b6b; background: rgba(255,107,107,.1); }
  .vote-btn.selected { border-color: #ff6b6b; background: rgba(255,107,107,.2); color: #ff6b6b; }

  /* 结果 */
  .result-card { text-align: center; }
  .result-card .emoji { font-size: 3rem; margin-bottom: 8px; }
  .result-card .title { font-size: 1.4rem; margin-bottom: 8px; }
  .result-card .detail { color: #889; font-size: .95rem; margin-bottom: 6px; }
  .result-card .words-reveal {
    margin-top: 16px; padding: 16px; background: rgba(255,255,255,.05);
    border-radius: 12px;
  }
  .result-card .words-reveal p { margin: 4px 0; }
  .result-card .words-reveal .wl { color: #48dbfb; }
  .result-card .words-reveal .wu { color: #ff6b6b; }

  .screen { display: none; }
  .screen.active { display: block; }
</style>
</head>
<body>

<h1>🕵️ 谁是卧底</h1>

<!-- 设置界面 -->
<div class="screen active" id="screen-setup">
  <div class="card">
    <h3>🎮 游戏设置</h3>
    <div class="setting-row">
      <label>玩家人数</label>
      <div class="ctrl">
        <button onclick="adjustPlayers(-1)">−</button>
        <span class="num" id="num-players">6</span>
        <button onclick="adjustPlayers(1)">+</button>
      </div>
    </div>
    <div class="setting-row">
      <label>卧底人数</label>
      <div class="ctrl">
        <button onclick="adjustUndercover(-1)">−</button>
        <span class="num" id="num-undercover">1</span>
        <button onclick="adjustUndercover(1)">+</button>
      </div>
    </div>
  </div>

  <div class="card">
    <h3>👥 玩家名字</h3>
    <div class="name-list" id="name-list"></div>
  </div>

  <div class="btn-group">
    <button class="btn btn-primary" onclick="startGame()">🎲 开始游戏</button>
  </div>
</div>

<!-- 看词界面 -->
<div class="screen" id="screen-peek">
  <div class="card word-reveal">
    <div class="player-name" id="peek-name"></div>
    <div class="word-card" id="peek-card">
      <div class="word" id="peek-word"></div>
    </div>
    <div class="word-hint" id="peek-hint">请记住你的词语，不要让别人看到！</div>
    <div class="btn-group">
      <button class="btn btn-primary" id="peek-btn" onclick="peekAction()">👀 查看词语</button>
    </div>
    <div style="color:#556;font-size:.8rem;margin-top:10px" id="peek-progress"></div>
  </div>
</div>

<!-- 描述界面 -->
<div class="screen" id="screen-describe">
  <div class="card">
    <div class="turn-info">
      <div class="current" id="desc-current"></div>
      <div class="desc-prompt">请轮流用一句话描述你的词语（不能直接说出来）</div>
    </div>
    <div class="player-status" id="desc-players"></div>
    <div class="btn-group">
      <button class="btn btn-success" onclick="finishDescribe()">✅ 描述完毕，开始投票</button>
    </div>
  </div>
</div>

<!-- 投票界面 -->
<div class="screen" id="screen-vote">
  <div class="card">
    <h3>🗳️ 投票环节</h3>
    <div class="turn-info">
      <div class="current" id="vote-current"></div>
      <div class="desc-prompt">请选择你认为最可能是卧底的人</div>
    </div>
    <div class="vote-grid" id="vote-grid"></div>
    <div class="btn-group">
      <button class="btn btn-danger" id="vote-confirm-btn" onclick="confirmVote()" style="opacity:.4">确认投票</button>
    </div>
  </div>
</div>

<!-- 淘汰结果 -->
<div class="screen" id="screen-eliminate">
  <div class="card result-card">
    <div class="emoji" id="elim-emoji"></div>
    <div class="title" id="elim-title"></div>
    <div class="detail" id="elim-detail"></div>
    <div id="elim-identity" style="margin-top:10px;font-size:1.1rem"></div>
    <div class="btn-group">
      <button class="btn btn-primary" onclick="nextRoundOrEnd()">继续游戏</button>
    </div>
  </div>
</div>

<!-- 最终结果 -->
<div class="screen" id="screen-final">
  <div class="card result-card">
    <div class="emoji" id="final-emoji"></div>
    <div class="title" id="final-title"></div>
    <div class="detail" id="final-detail"></div>
    <div class="words-reveal">
      <p>平民词：<span class="wl" id="final-word-civil"></span></p>
      <p>卧底词：<span class="wu" id="final-word-undercover"></span></p>
    </div>
    <div class="btn-group">
      <button class="btn btn-primary" onclick="resetGame()">🔄 再来一局</button>
    </div>
  </div>
</div>

<script>
/* ========== 词库 ========== */
const WORD_PAIRS = [
  ['苹果','手机'], ['牛奶','豆浆'], ['可乐','雪碧'], ['面包','蛋糕'],
  ['咖啡','奶茶'], ['地铁','公交'], ['微信','QQ'], ['抖音','快手'],
  ['篮球','足球'], ['钢琴','吉他'], ['沙发','床'], ['雨伞','阳伞'],
  ['眼镜','墨镜'], ['饺子','馄饨'], ['面条','粉丝'], ['包子','馒头'],
  ['西瓜','哈密瓜'], ['葡萄','蓝莓'], ['猫','狗'], ['兔子','仓鼠'],
  ['蝴蝶','蜻蜓'], ['玫瑰','百合'], ['松树','竹子'], ['大海','湖泊'],
  ['高山','丘陵'], ['沙漠','草原'], ['台风','暴雨'], ['日出','日落'],
  ['医生','护士'], ['老师','教授'], ['警察','保安'], ['厨师','服务员'],
  ['飞机','高铁'], ['轮船','潜艇'], ['自行车','电动车'], ['汽车','卡车'],
  ['学校','公司'], ['医院','药店'], ['超市','商场'], ['图书馆','博物馆'],
  ['春节','中秋'], ['婚礼','葬礼'], ['生日','周年'], ['毕业','开学'],
  ['电影','电视剧'], ['小说','散文'], ['音乐','舞蹈'], ['画画','摄影'],
  ['火锅','烧烤'], ['寿司','刺身'], ['汉堡','三明治'], ['饺子','锅贴'],
  ['程序员','设计师'], ['老板','员工'], ['房东','租客'], ['男友','闺蜜'],
  ['近视','远视'], ['失眠','嗜睡'], ['胖子','瘦子'], ['高个子','矮个子'],
  ['空调','暖氣'], ['冰箱','冰柜'], ['洗衣机','烘干机'], ['电视','投影'],
];

/* ========== 游戏状态 ========== */
let numPlayers = 6, numUndercover = 1;
let players = []; // { name, word, isUndercover, alive, voted }
let civilWord = '', undercoverWord = '';
let currentPeek = 0, currentDescribe = 0, currentVoter = 0;
let votes = {}; // voterIdx -> targetIdx
let selectedVote = null;

function adjustPlayers(d) {
  numPlayers = Math.max(4, Math.min(12, numPlayers + d));
  document.getElementById('num-players').textContent = numPlayers;
  if (numUndercover >= Math.floor(numPlayers / 2)) {
    numUndercover = Math.floor(numPlayers / 2) - 1;
    if (numUndercover < 1) numUndercover = 1;
    document.getElementById('num-undercover').textContent = numUndercover;
  }
  renderNameInputs();
}

function adjustUndercover(d) {
  const max = Math.floor(numPlayers / 2) - 1;
  numUndercover = Math.max(1, Math.min(max, numUndercover + d));
  document.getElementById('num-undercover').textContent = numUndercover;
}

function renderNameInputs() {
  const list = document.getElementById('name-list');
  const existing = [];
  list.querySelectorAll('input').forEach(inp => existing.push(inp.value));
  list.innerHTML = '';
  for (let i = 0; i < numPlayers; i++) {
    const div = document.createElement('div');
    div.className = 'name-input';
    div.innerHTML = `<span>${i+1}.</span><input type="text" placeholder="玩家${i+1}" value="${existing[i] || ''}">`;
    list.appendChild(div);
  }
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

/* ========== 开始游戏 ========== */
function startGame() {
  // 收集名字
  const inputs = document.querySelectorAll('#name-list input');
  const names = [];
  for (let i = 0; i < numPlayers; i++) {
    names.push(inputs[i].value.trim() || `玩家${i+1}`);
  }
  // 检查重名
  const unique = new Set(names);
  if (unique.size !== names.length) { alert('玩家名字不能重复！'); return; }

  // 选词
  const pair = WORD_PAIRS[Math.floor(Math.random() * WORD_PAIRS.length)];
  if (Math.random() > 0.5) {
    civilWord = pair[0]; undercoverWord = pair[1];
  } else {
    civilWord = pair[1]; undercoverWord = pair[0];
  }

  // 分配身份
  const indices = Array.from({length: numPlayers}, (_, i) => i);
  // 随机选卧底
  const undercoverIndices = new Set();
  while (undercoverIndices.size < numUndercover) {
    const ri = Math.floor(Math.random() * numPlayers);
    undercoverIndices.add(ri);
  }

  players = names.map((name, i) => ({
    name,
    word: undercoverIndices.has(i) ? undercoverWord : civilWord,
    isUndercover: undercoverIndices.has(i),
    alive: true,
  }));

  currentPeek = 0;
  showScreen('screen-peek');
  showPeek();
}

/* ========== 看词阶段 ========== */
function showPeek() {
  const p = players[currentPeek];
  document.getElementById('peek-name').textContent = `请将手机传给 ${p.name}`;
  document.getElementById('peek-word').textContent = '???';
  document.getElementById('peek-card').classList.add('hidden-word');
  document.getElementById('peek-hint').textContent = '确认周围没人能看到屏幕后点击查看';
  document.getElementById('peek-btn').textContent = '👀 查看词语';
  document.getElementById('peek-btn').onclick = revealWord;
  document.getElementById('peek-progress').textContent = `${currentPeek + 1} / ${numPlayers}`;
}

function revealWord() {
  const p = players[currentPeek];
  document.getElementById('peek-word').textContent = p.word;
  document.getElementById('peek-card').classList.remove('hidden-word');
  document.getElementById('peek-hint').textContent = p.isUndercover ? '你是卧底！请注意隐藏身份' : '请记住你的词语';
  document.getElementById('peek-btn').textContent = '✅ 我记住了，下一位';
  document.getElementById('peek-btn').onclick = nextPeek;
}

function nextPeek() {
  currentPeek++;
  if (currentPeek >= numPlayers) {
    // 进入描述阶段
    currentDescribe = 0;
    showScreen('screen-describe');
    showDescribe();
  } else {
    showPeek();
  }
}

/* ========== 描述阶段 ========== */
function showDescribe() {
  const alivePlayers = players.filter(p => p.alive);
  document.getElementById('desc-current').textContent =
    `请从 ${alivePlayers[0].name} 开始轮流描述`;
  renderDescPlayers();
}

function renderDescPlayers() {
  const container = document.getElementById('desc-players');
  container.innerHTML = '';
  players.forEach((p, i) => {
    const tag = document.createElement('span');
    tag.className = 'player-tag' + (p.alive ? '' : ' eliminated');
    tag.textContent = p.name;
    container.appendChild(tag);
  });
}

function finishDescribe() {
  currentVoter = 0;
  votes = {};
  selectedVote = null;
  showScreen('screen-vote');
  showVote();
}

/* ========== 投票阶段 ========== */
function showVote() {
  const alivePlayers = players.filter(p => p.alive);
  const voter = alivePlayers[currentVoter];
  document.getElementById('vote-current').textContent = `${voter.name} 请投票`;

  const grid = document.getElementById('vote-grid');
  grid.innerHTML = '';
  selectedVote = null;
  document.getElementById('vote-confirm-btn').style.opacity = '.4';

  players.forEach((p, i) => {
    if (!p.alive) return;
    if (p.name === voter.name) return;
    const btn = document.createElement('button');
    btn.className = 'vote-btn';
    btn.textContent = p.name;
    btn.onclick = () => selectVote(i, btn);
    grid.appendChild(btn);
  });
}

function selectVote(idx, btn) {
  document.querySelectorAll('.vote-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  selectedVote = idx;
  document.getElementById('vote-confirm-btn').style.opacity = '1';
}

function confirmVote() {
  if (selectedVote === null) return;
  const alivePlayers = players.filter(p => p.alive);
  const voter = alivePlayers[currentVoter];
  const voterIdx = players.indexOf(voter);
  votes[voterIdx] = selectedVote;

  currentVoter++;
  if (currentVoter >= alivePlayers.length) {
    // 计票
    tallyVotes();
  } else {
    showVote();
  }
}

function tallyVotes() {
  const counts = {};
  for (const target of Object.values(votes)) {
    counts[target] = (counts[target] || 0) + 1;
  }

  // 找最高票
  let maxVotes = 0;
  for (const c of Object.values(counts)) if (c > maxVotes) maxVotes = c;

  const topVoted = Object.entries(counts)
    .filter(([_, c]) => c === maxVotes)
    .map(([idx, _]) => parseInt(idx));

  if (topVoted.length > 1) {
    // 平票：平票的人之间再投
    document.getElementById('elim-emoji').textContent = '🤷';
    document.getElementById('elim-title').textContent = '票数相同！';
    const names = topVoted.map(i => players[i].name).join(' 和 ');
    document.getElementById('elim-detail').textContent = `${names} 票数相同（各${maxVotes}票），两人安全`;
    document.getElementById('elim-identity').textContent = '';
    showScreen('screen-eliminate');
    // 标记为特殊处理
    document.querySelector('#screen-eliminate .btn').onclick = () => {
      currentVoter = 0; votes = {}; selectedVote = null;
      showScreen('screen-vote'); showVote();
    };
    return;
  }

  const eliminated = topVoted[0];
  const p = players[eliminated];

  document.getElementById('elim-emoji').textContent = p.isUndercover ? '🎉' : '😱';
  document.getElementById('elim-title').textContent = `${p.name} 被投票出局（${maxVotes}票）`;
  document.getElementById('elim-detail').textContent = '';
  document.getElementById('elim-identity').innerHTML =
    `${p.name} 的身份是：<strong style="color:${p.isUndercover ? '#ff6b6b' : '#48dbfb'}">${p.isUndercover ? '🕵️ 卧底' : '😇 平民'}</strong>`;

  p.alive = false;
  showScreen('screen-eliminate');
  document.querySelector('#screen-eliminate .btn').onclick = nextRoundOrEnd;
}

/* ========== 回合结束判断 ========== */
function nextRoundOrEnd() {
  const aliveUndercover = players.filter(p => p.alive && p.isUndercover).length;
  const aliveCivil = players.filter(p => p.alive && !p.isUndercover).length;

  if (aliveUndercover === 0) {
    // 平民胜利
    showFinal(true);
  } else if (aliveUndercover >= aliveCivil) {
    // 卧底胜利
    showFinal(false);
  } else {
    // 继续下一轮
    currentVoter = 0; votes = {}; selectedVote = null;
    showScreen('screen-vote');
    showVote();
  }
}

function showFinal(civilWin) {
  const undercoverNames = players.filter(p => p.isUndercover).map(p => p.name);
  document.getElementById('final-emoji').textContent = civilWin ? '🎊' : '🕵️';
  document.getElementById('final-title').textContent = civilWin ? '平民胜利！' : '卧底胜利！';
  document.getElementById('final-detail').textContent = civilWin
    ? `卧底 ${undercoverNames.join('、')} 被发现！`
    : `卧底 ${undercoverNames.join('、')} 成功潜伏！`;
  document.getElementById('final-word-civil').textContent = civilWord;
  document.getElementById('final-word-undercover').textContent = undercoverWord;
  showScreen('screen-final');
}

function resetGame() {
  showScreen('screen-setup');
  renderNameInputs();
}

/* 初始化 */
renderNameInputs();
</script>
</body>
</html>
