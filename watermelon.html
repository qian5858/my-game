<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>合成大西瓜</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: linear-gradient(180deg, #1a0a2e, #0a1a2e);
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: flex-start;
    padding-top: 10px; font-family: 'Segoe UI', sans-serif;
    color: #e0e0e0; user-select: none; overflow: hidden;
    /* 微信修复 */
    -webkit-overflow-scrolling: touch;
  }
  .header {
    display: flex; align-items: center; gap: 20px;
    margin-bottom: 8px; font-size: 1rem; flex-wrap: wrap; justify-content: center;
  }
  .header .item {
    display: flex; align-items: center; gap: 5px;
    background: rgba(255,255,255,.06); padding: 5px 14px; border-radius: 20px;
  }
  .header .val { font-weight: bold; color: #feca57; min-width: 30px; text-align: center; }
  .canvas-wrap {
    position: relative; border-radius: 12px; overflow: hidden;
    box-shadow: 0 0 40px rgba(100,200,100,.15);
    border: 2px solid rgba(100,200,100,.2);
  }
  canvas { display: block; cursor: pointer; }
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.6);
    display: flex; align-items: center; justify-content: center;
    z-index: 100; backdrop-filter: blur(4px);
  }
  .overlay.hidden { display: none; }
  .modal {
    background: linear-gradient(135deg, #1a3a1e, #2b5530); padding: 36px 52px;
    border-radius: 20px; text-align: center;
    box-shadow: 0 0 50px rgba(100,200,100,.2);
  }
  .modal h2 { font-size: 1.8rem; margin-bottom: 8px; color: #4caf50; }
  .modal p { margin-bottom: 18px; color: #aaa; font-size: 1.05rem; }
  .modal button {
    padding: 10px 36px; border: none; border-radius: 10px;
    background: linear-gradient(135deg, #66bb6a, #43a047);
    color: #fff; font-size: 1rem; font-weight: bold;
    cursor: pointer; transition: transform .2s;
  }
  .modal button:hover { transform: scale(1.06); }
  .tip { color: #556; font-size: .78rem; margin-top: 8px; }
  .bgm-toggle {
    position: fixed; top: 10px; right: 10px; z-index: 9999;
    width: 44px; height: 44px; border-radius: 50%; border: 2px solid rgba(255,255,255,.3);
    background: rgba(0,0,0,.5); color: #fff; font-size: 1.4rem;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent;
    /* 微信WebView强制显示 */
    visibility: visible !important; opacity: 1 !important;
    -webkit-transform: translateZ(0); transform: translateZ(0);
  }
  /* 进化路线 */
  .evolution {
    display: flex; align-items: center; gap: 2px;
    margin-bottom: 8px; font-size: .85rem;
  }
  .evolution .fruit-icon {
    width: 28px; height: 28px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 1rem; border: 1px solid rgba(255,255,255,.15);
  }
  .evolution .arrow { color: #556; font-size: .7rem; }
</style>
</head>
<body>

<div class="bgm-toggle" id="bgmToggle" ontouchstart="toggleBGM();event.preventDefault()" onclick="toggleBGM()">🔊</div>
<div style="position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:-1" id="touchCatcher"></div>

<div class="header">
  <div class="item">🏆 分数 <span class="val" id="score">0</span></div>
  <div class="item">🍉 最高 <span class="val" id="best">0</span></div>
</div>

<div class="evolution" id="evolution"></div>

<div class="canvas-wrap">
  <canvas id="game"></canvas>
</div>
<p class="tip">点击屏幕投放水果 · 相同水果碰撞合成更大的 · 别溢出！</p>

<div class="overlay hidden" id="overlay">
  <div class="modal">
    <h2 id="r-title">游戏结束</h2>
    <p id="r-msg"></p>
    <button onclick="restartGame()">再来一局</button>
  </div>
</div>

<script>
/* ========== 音效 ========== */
let audioCtx;
let audioUnlocked = false;

function initAudio() {
  // 微信JSBridge解锁音频
  if (typeof WeixinJSBridge !== 'undefined') {
    WeixinJSBridge.invoke('getNetworkType', {}, function() {
      _createAudioCtx();
    }, function() {
      _createAudioCtx();
    });
  } else {
    _createAudioCtx();
  }
}

function _createAudioCtx() {
  if (audioCtx) {
    if (audioCtx.state === 'suspended') {
      audioCtx.resume().then(() => {
        audioUnlocked = true;
        if (bgmEnabled && !bgmPlaying) startBGM();
      }).catch(function(){});
    }
    return;
  }
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    // 创建静音缓冲来强制解锁
    const buf = audioCtx.createBuffer(1, 1, 22050);
    const src = audioCtx.createBufferSource();
    src.buffer = buf;
    src.connect(audioCtx.destination);
    src.start(0);
    audioUnlocked = true;
    if (bgmEnabled) startBGM();
  } catch(e) {
    console.warn('AudioContext not supported');
  }
}

function playNote(f,d,t,v,dl) {
  if (!audioCtx) return;
  try {
    const tm = audioCtx.currentTime + (dl||0);
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = t||'sine'; o.frequency.setValueAtTime(f,tm);
    // 微信需要更大的音量
    const vol = (v||0.08) * 1.5;
    g.gain.setValueAtTime(vol,tm);
    g.gain.exponentialRampToValueAtTime(0.001,tm+d);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(tm); o.stop(tm+d);
  } catch(e) {}
}
function sfxDrop() { initAudio(); playNote(500,.1,'sine',.1); }
function sfxMerge(lv) { initAudio(); playNote(400+lv*80,.2,'sine',.15); playNote(600+lv*80,.15,'sine',.1,.06); }
function sfxGameOver() { initAudio(); playNote(300,.3,'sawtooth',.1); playNote(200,.4,'sawtooth',.08,.15); }

/* ========== 背景音乐 ========== */
let bgmEnabled = true;
let bgmPlaying = false;
let bgmInterval = null;
let bgmGainNode = null;

// 五声音阶旋律 - 轻松愉快的风格
const PENTATONIC = [262, 294, 330, 392, 440, 524, 588, 660, 784, 880];
const MELODY_PATTERNS = [
  [0,2,4,5,4,2,0,2], [4,5,6,7,6,5,4,2], [0,4,2,5,4,7,5,6],
  [2,4,5,4,2,0,2,4], [5,6,7,8,7,6,5,4], [0,2,4,7,5,4,2,0],
  [4,2,0,2,4,5,7,5], [6,5,4,2,4,5,6,7], [0,5,4,2,0,4,5,7],
  [2,4,7,5,6,4,2,0],
];
const BASS_NOTES = [131, 147, 165, 196, 220]; // C3,A2,C3,G2,A2
let melodyIdx = 0;
let noteIdx = 0;
let bassIdx = 0;

function startBGM() {
  if (!audioCtx || bgmPlaying) return;
  bgmPlaying = true;
  melodyIdx = Math.floor(Math.random() * MELODY_PATTERNS.length);
  noteIdx = 0; bassIdx = 0;

  // 主音轨
  bgmGainNode = audioCtx.createGain();
  bgmGainNode.gain.value = 0.08;
  bgmGainNode.connect(audioCtx.destination);

  bgmInterval = setInterval(() => {
    if (!audioCtx || audioCtx.state === 'suspended') return;
    const pattern = MELODY_PATTERNS[melodyIdx];
    const freq = PENTATONIC[pattern[noteIdx % pattern.length]];

    // 旋律音
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, now);
    g.gain.setValueAtTime(0.08, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
    osc.connect(g); g.connect(bgmGainNode);
    osc.start(now); osc.stop(now + 0.4);

    // 低音伴奏（每4拍）
    if (noteIdx % 4 === 0) {
      const bassFreq = BASS_NOTES[bassIdx % BASS_NOTES.length];
      const bOsc = audioCtx.createOscillator();
      const bG = audioCtx.createGain();
      bOsc.type = 'triangle';
      bOsc.frequency.setValueAtTime(bassFreq, now);
      bG.gain.setValueAtTime(0.06, now);
      bG.gain.exponentialRampToValueAtTime(0.001, now + 0.8);
      bOsc.connect(bG); bG.connect(bgmGainNode);
      bOsc.start(now); bOsc.stop(now + 0.9);
      bassIdx++;
    }

    // 和弦点缀（每8拍）
    if (noteIdx % 8 === 0) {
      const chordBase = PENTATONIC[pattern[noteIdx % pattern.length]] / 2;
      [1, 1.25, 1.5].forEach((ratio, ci) => {
        const cOsc = audioCtx.createOscillator();
        const cG = audioCtx.createGain();
        cOsc.type = 'sine';
        cOsc.frequency.setValueAtTime(chordBase * ratio, now);
        cG.gain.setValueAtTime(0.03, now + ci * 0.05);
        cG.gain.exponentialRampToValueAtTime(0.001, now + 1.2);
        cOsc.connect(cG); cG.connect(bgmGainNode);
        cOsc.start(now + ci * 0.05); cOsc.stop(now + 1.3);
      });
    }

    noteIdx++;
    if (noteIdx >= pattern.length) {
      noteIdx = 0;
      melodyIdx = (melodyIdx + 1) % MELODY_PATTERNS.length;
    }
  }, 280);
}

function stopBGM() {
  bgmPlaying = false;
  if (bgmInterval) { clearInterval(bgmInterval); bgmInterval = null; }
  if (bgmGainNode) { bgmGainNode.gain.value = 0; bgmGainNode = null; }
}

function toggleBGM() {
  bgmEnabled = !bgmEnabled;
  document.getElementById('bgmToggle').textContent = bgmEnabled ? '🔊' : '🔇';
  if (bgmEnabled) {
    initAudio();
    startBGM();
  } else {
    stopBGM();
  }
}

/* ========== 水果定义 ========== */
const FRUITS = [
  { name: '葡萄', emoji: '🍇', radius: 16, color: '#9b59b6', light: '#d2b4de', score: 1 },
  { name: '樱桃', emoji: '🍒', radius: 20, color: '#e74c3c', light: '#f1948a', score: 3 },
  { name: '橘子', emoji: '🍊', radius: 26, color: '#e67e22', light: '#f0b27a', score: 6 },
  { name: '柠檬', emoji: '🍋', radius: 32, color: '#f1c40f', light: '#f9e79f', score: 10 },
  { name: '猕猴桃', emoji: '🥝', radius: 38, color: '#27ae60', light: '#82e0aa', score: 15 },
  { name: '番茄', emoji: '🍅', radius: 46, color: '#c0392b', light: '#e6b0aa', score: 21 },
  { name: '桃子', emoji: '🍑', radius: 54, color: '#fd79a8', light: '#f5b7b1', score: 28 },
  { name: '菠萝', emoji: '🍍', radius: 62, color: '#f39c12', light: '#fad7a0', score: 36 },
  { name: '椰子', emoji: '🥥', radius: 72, color: '#8d6e63', light: '#bcaaa4', score: 45 },
  { name: '西瓜', emoji: '🍉', radius: 84, color: '#2ecc71', light: '#82e0aa', score: 55 },
];

/* ========== 画布设置 ========== */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = 400, H = 600;
canvas.width = W; canvas.height = H;

const WALL_LEFT = 10, WALL_RIGHT = W - 10, FLOOR = H - 10;
const DROP_Y = 60;
const DANGER_Y = DROP_Y + 30;
const GRAVITY = 0.4;
const FRICTION = 0.98;
const BOUNCE = 0.3;

/* ========== 进化路线显示 ========== */
const evoEl = document.getElementById('evolution');
FRUITS.forEach((f, i) => {
  const span = document.createElement('span');
  span.className = 'fruit-icon';
  span.textContent = f.emoji;
  span.style.background = f.color + '33';
  evoEl.appendChild(span);
  if (i < FRUITS.length - 1) {
    const arrow = document.createElement('span');
    arrow.className = 'arrow';
    arrow.textContent = '▶';
    evoEl.appendChild(arrow);
  }
});

/* ========== 游戏状态 ========== */
let bodies = [];
let score = 0;
let bestScore = parseInt(localStorage.getItem('watermelon_best') || '0');
let nextFruit = 0;
let currentFruit = 0;
let dropX = W / 2;
let canDrop = true;
let dropCooldown = 0;
let gameOver = false;
let dangerTimer = 0;
let mergeEffects = []; // { x, y, r, alpha, emoji }

document.getElementById('best').textContent = bestScore;

function randomSmallFruit() {
  // 只掉落前5种小水果
  return Math.floor(Math.random() * 5);
}

function restartGame() {
  bodies = [];
  score = 0;
  document.getElementById('score').textContent = 0;
  gameOver = false;
  dangerTimer = 0;
  canDrop = true;
  dropCooldown = 0;
  mergeEffects = [];
  currentFruit = randomSmallFruit();
  nextFruit = randomSmallFruit();
  dropX = W / 2;
  document.getElementById('overlay').classList.add('hidden');
}

/* ========== 物理体 ========== */
class Body {
  constructor(x, y, fruitType) {
    this.x = x; this.y = y;
    this.vx = 0; this.vy = 0;
    this.fruit = fruitType;
    this.r = FRUITS[fruitType].radius;
    this.mass = this.r * this.r;
    this.merging = false;
    this.settled = 0; // 静止帧数
  }
}

/* ========== 碰撞检测 ========== */
function circleCollide(a, b) {
  const dx = b.x - a.x, dy = b.y - a.y;
  const dist = Math.sqrt(dx * dx + dy * dy);
  const minDist = a.r + b.r;
  if (dist < minDist && dist > 0.01) {
    return { dx: dx / dist, dy: dy / dist, overlap: minDist - dist, dist };
  }
  return null;
}

function resolveCollision(a, b) {
  const col = circleCollide(a, b);
  if (!col) return false;

  // 分离
  const sep = col.overlap / 2;
  a.x -= col.dx * sep; a.y -= col.dy * sep;
  b.x += col.dx * sep; b.y += col.dy * sep;

  // 弹性碰撞
  const relVx = a.vx - b.vx, relVy = a.vy - b.vy;
  const relVn = relVx * col.dx + relVy * col.dy;
  if (relVn > 0) return true;

  const totalMass = a.mass + b.mass;
  const impulse = -(1 + BOUNCE) * relVn / totalMass;
  a.vx += impulse * b.mass * col.dx;
  a.vy += impulse * b.mass * col.dy;
  b.vx -= impulse * a.mass * col.dx;
  b.vy -= impulse * a.mass * col.dy;

  return true;
}

/* ========== 合成检测 ========== */
function checkMerges() {
  for (let i = 0; i < bodies.length; i++) {
    for (let j = i + 1; j < bodies.length; j++) {
      const a = bodies[i], b = bodies[j];
      if (a.merging || b.merging) continue;
      if (a.fruit !== b.fruit) continue;
      if (a.fruit >= FRUITS.length - 1) continue; // 西瓜不能再合
      const col = circleCollide(a, b);
      if (col) {
        // 合成！
        const newType = a.fruit + 1;
        const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
        a.merging = true; b.merging = true;

        // 特效
        mergeEffects.push({ x: mx, y: my, r: FRUITS[newType].radius * 1.5, alpha: 1, emoji: FRUITS[newType].emoji });

        setTimeout(() => {
          bodies = bodies.filter(b => b !== a && b !== b);
          const newBody = new Body(mx, my, newType);
          newBody.vx = (a.vx + b.vx) * 0.3;
          newBody.vy = Math.min(a.vy, b.vy) - 2;
          bodies.push(newBody);
        }, 0);

        score += FRUITS[newType].score;
        document.getElementById('score').textContent = score;
        sfxMerge(newType);
        return true;
      }
    }
  }
  return false;
}

/* ========== 更新 ========== */
function update() {
  if (gameOver) return;

  // 冷却
  if (dropCooldown > 0) { dropCooldown--; if (dropCooldown <= 0) canDrop = true; }

  // 物理
  for (const b of bodies) {
    b.vy += GRAVITY;
    b.vx *= FRICTION;
    b.x += b.vx;
    b.y += b.vy;

    // 墙壁
    if (b.x - b.r < WALL_LEFT) { b.x = WALL_LEFT + b.r; b.vx = Math.abs(b.vx) * BOUNCE; }
    if (b.x + b.r > WALL_RIGHT) { b.x = WALL_RIGHT - b.r; b.vx = -Math.abs(b.vx) * BOUNCE; }
    if (b.y + b.r > FLOOR) { b.y = FLOOR - b.r; b.vy = -Math.abs(b.vy) * BOUNCE; b.vx *= 0.9; }

    // 静止检测
    if (Math.abs(b.vx) < 0.1 && Math.abs(b.vy) < 0.1) b.settled++;
    else b.settled = 0;
  }

  // 碰撞解算（多次迭代）
  for (let iter = 0; iter < 4; iter++) {
    for (let i = 0; i < bodies.length; i++) {
      for (let j = i + 1; j < bodies.length; j++) {
        resolveCollision(bodies[i], bodies[j]);
      }
    }
  }

  // 合成
  checkMerges();

  // 清理合成标记
  bodies = bodies.filter(b => !b.merging);

  // 溢出检测
  let danger = false;
  for (const b of bodies) {
    if (b.y - b.r < DANGER_Y && b.settled > 60) {
      danger = true; break;
    }
  }
  if (danger) {
    dangerTimer++;
    if (dangerTimer > 90) { // 约1.5秒
      gameOver = true;
      sfxGameOver();
      if (score > bestScore) {
        bestScore = score;
        localStorage.setItem('watermelon_best', bestScore);
        document.getElementById('best').textContent = bestScore;
      }
      setTimeout(() => {
        document.getElementById('r-title').textContent = '🍉 游戏结束';
        document.getElementById('r-msg').textContent = `得分：${score} 分`;
        document.getElementById('overlay').classList.remove('hidden');
      }, 500);
    }
  } else {
    dangerTimer = 0;
  }

  // 特效更新
  for (const e of mergeEffects) { e.alpha -= 0.03; e.r += 1; }
  mergeEffects = mergeEffects.filter(e => e.alpha > 0);
}

/* ========== 渲染 ========== */
function draw() {
  ctx.clearRect(0, 0, W, H);

  // 背景
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#1a2a1a');
  bg.addColorStop(1, '#0a1a0a');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // 容器壁
  ctx.fillStyle = '#2a3a2a';
  ctx.fillRect(0, 0, WALL_LEFT, H);
  ctx.fillRect(WALL_RIGHT, 0, W - WALL_RIGHT, H);
  ctx.fillRect(0, FLOOR, W, H - FLOOR);

  // 危险线
  ctx.strokeStyle = dangerTimer > 0 ? `rgba(255,50,50,${0.5 + Math.sin(Date.now()/100)*0.3})` : 'rgba(255,100,100,0.2)';
  ctx.lineWidth = 2;
  ctx.setLineDash([8, 6]);
  ctx.beginPath(); ctx.moveTo(WALL_LEFT, DANGER_Y); ctx.lineTo(WALL_RIGHT, DANGER_Y); ctx.stroke();
  ctx.setLineDash([]);

  // 水果
  for (const b of bodies) {
    drawFruit(b.x, b.y, b.r, b.fruit);
  }

  // 合成特效
  for (const e of mergeEffects) {
    ctx.globalAlpha = e.alpha;
    ctx.font = `${Math.floor(e.r)}px sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(e.emoji, e.x, e.y);
    // 光环
    ctx.strokeStyle = `rgba(255,255,255,${e.alpha * 0.5})`;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // 待投放水果
  if (canDrop && !gameOver) {
    // 瞄准线
    ctx.strokeStyle = 'rgba(255,255,255,0.15)';
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 4]);
    ctx.beginPath(); ctx.moveTo(dropX, DROP_Y); ctx.lineTo(dropX, FLOOR); ctx.stroke();
    ctx.setLineDash([]);

    drawFruit(dropX, DROP_Y, FRUITS[currentFruit].radius, currentFruit);

    // 下一个预览
    ctx.globalAlpha = 0.5;
    ctx.font = '12px sans-serif';
    ctx.fillStyle = '#888';
    ctx.textAlign = 'center';
    ctx.fillText('下一个', W - 40, DROP_Y - 18);
    drawFruit(W - 40, DROP_Y + 8, FRUITS[nextFruit].radius * 0.6, nextFruit);
    ctx.globalAlpha = 1;
  }

  // 分数
  // (已在 HTML 中显示)
}

function drawFruit(x, y, r, type) {
  const f = FRUITS[type];

  // 3D 球体
  const grad = ctx.createRadialGradient(x - r * 0.25, y - r * 0.25, r * 0.1, x, y, r);
  grad.addColorStop(0, f.light);
  grad.addColorStop(0.6, f.color);
  grad.addColorStop(1, darkenColor(f.color, 0.5));
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fill();

  // 高光
  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  ctx.beginPath();
  ctx.ellipse(x - r * 0.2, y - r * 0.3, r * 0.4, r * 0.25, -0.3, 0, Math.PI * 2);
  ctx.fill();

  // emoji
  const fontSize = Math.max(10, Math.floor(r * 0.9));
  ctx.font = `${fontSize}px sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(f.emoji, x, y + 1);
}

function darkenColor(hex, factor) {
  const r = parseInt(hex.slice(1,3), 16);
  const g = parseInt(hex.slice(3,5), 16);
  const b = parseInt(hex.slice(5,7), 16);
  return `rgb(${Math.floor(r*factor)},${Math.floor(g*factor)},${Math.floor(b*factor)})`;
}

/* ========== 输入 ========== */
canvas.addEventListener('mousemove', e => {
  if (!canDrop || gameOver) return;
  const rect = canvas.getBoundingClientRect();
  dropX = (e.clientX - rect.left) * (W / rect.width);
  dropX = Math.max(WALL_LEFT + FRUITS[currentFruit].radius, Math.min(WALL_RIGHT - FRUITS[currentFruit].radius, dropX));
});

canvas.addEventListener('click', e => {
  if (!canDrop || gameOver) return;
  initAudio();
  dropFruit();
});

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (!canDrop || gameOver) return;
  const rect = canvas.getBoundingClientRect();
  const touch = e.touches[0];
  dropX = (touch.clientX - rect.left) * (W / rect.width);
  dropX = Math.max(WALL_LEFT + FRUITS[currentFruit].radius, Math.min(WALL_RIGHT - FRUITS[currentFruit].radius, dropX));
});

canvas.addEventListener('touchend', e => {
  if (!canDrop || gameOver) return;
  initAudio();
  dropFruit();
});

function dropFruit() {
  const body = new Body(dropX, DROP_Y, currentFruit);
  bodies.push(body);
  sfxDrop();
  canDrop = false;
  dropCooldown = 25;

  currentFruit = nextFruit;
  nextFruit = randomSmallFruit();

  // 50% 概率出更大的水果
  if (Math.random() < 0.15 && score > 50) {
    currentFruit = Math.min(4, currentFruit + 1);
  }
}

/* ========== 主循环 ========== */
function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

restartGame();
loop();

/* ========== 微信音频解锁 ========== */
// 方案1: 微信JSBridge
if (typeof WeixinJSBridge !== 'undefined') {
  WeixinJSBridge.on('onVoicePlayEnd', function(){});
  WeixinJSBridge.invoke('getNetworkType', {}, function() {
    initAudio();
  }, function(){ initAudio(); });
}

// 方案2: 所有交互事件都尝试解锁
var _unlockEvents = ['touchstart','touchend','touchmove','click','keydown'];
function _tryUnlock(e) {
  initAudio();
  // 解锁后移除监听
  var allUnlocked = true;
  _unlockEvents.forEach(function(ev) {
    document.removeEventListener(ev, _tryUnlock);
  });
}
_unlockEvents.forEach(function(ev) {
  document.addEventListener(ev, _tryUnlock, { once: false, passive: true });
});

// 方案3: 页面可见性变化时恢复
 document.addEventListener('visibilitychange', function() {
  if (!document.hidden && bgmEnabled) {
    initAudio();
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume().then(function() {
        if (!bgmPlaying) startBGM();
      }).catch(function(){});
    } else if (!bgmPlaying) {
      startBGM();
    }
  }
});

// 方案4: 定时检查音频状态（微信可能在延迟后才允许）
var _audioCheckCount = 0;
var _audioCheckTimer = setInterval(function() {
  _audioCheckCount++;
  if (_audioCheckCount > 20 || audioUnlocked) { clearInterval(_audioCheckTimer); return; }
  if (audioCtx && audioCtx.state === 'running' && !bgmPlaying && bgmEnabled) {
    startBGM();
  }
}, 500);
</script>
