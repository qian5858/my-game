<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flappy Bird</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: linear-gradient(180deg, #1a1a2e, #16213e);
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    font-family: 'Segoe UI', sans-serif;
    color: #e0e0e0; user-select: none; overflow: hidden;
  }
  .header {
    display: flex; align-items: center; gap: 20px;
    margin-bottom: 8px; font-size: 1rem;
  }
  .header .item {
    display: flex; align-items: center; gap: 5px;
    background: rgba(255,255,255,.06); padding: 5px 14px; border-radius: 20px;
  }
  .header .val { font-weight: bold; color: #feca57; min-width: 28px; text-align: center; }
  .canvas-wrap {
    border: 2px solid #2a2a4a; border-radius: 12px; overflow: hidden;
    box-shadow: 0 0 40px rgba(72,219,251,.08);
    position: relative;
  }
  canvas { display: block; cursor: pointer; }
  .tip {
    margin-top: 8px; font-size: .8rem; color: #556;
    text-align: center;
  }
</style>
</head>
<body>

<div class="header">
  <div class="item">🏅 分数 <span class="val" id="score">0</span></div>
  <div class="item">🏆 最高 <span class="val" id="best">0</span></div>
  <div class="item">🎮 难度 <span class="val" id="diff">普通</span></div>
</div>
<div class="canvas-wrap">
  <canvas id="cv"></canvas>
</div>
<div class="tip">点击 / 空格 / ↑ 扇翅膀 · 长按持续飞行</div>

<script>
/* ========== 画布初始化 ========== */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const W = 400, H = 600;
cv.width = W; cv.height = H;

/* ========== 音频 ========== */
let audioCtx;
function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
function playTone(freq, dur, type='square', vol=.12) {
  if (!audioCtx) return;
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(.001, audioCtx.currentTime + dur);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(); o.stop(audioCtx.currentTime + dur);
}
function sfxFlap() { playTone(600, .08, 'sine', .1); playTone(800, .06, 'sine', .06); }
function sfxScore() { playTone(880, .1, 'sine', .1); setTimeout(() => playTone(1100, .12, 'sine', .1), 80); }
function sfxHit() { playTone(200, .3, 'sawtooth', .15); }

/* ========== 游戏常量 ========== */
const GRAVITY = 0.45;
const FLAP_VEL = -7.5;
const PIPE_W = 60;
const PIPE_GAP_INIT = 155;
const PIPE_SPEED_INIT = 2.5;
const PIPE_INTERVAL = 200; // frames between pipes
const GROUND_H = 60;

/* ========== 难度 ========== */
const DIFFS = [
  { name: '简单', gap: 175, speed: 2, interval: 230, gravity: 0.4 },
  { name: '普通', gap: 155, speed: 2.5, interval: 200, gravity: 0.45 },
  { name: '困难', gap: 130, speed: 3, interval: 170, gravity: 0.5 },
];
let diffIdx = 1;
let DIFF = DIFFS[diffIdx];

/* ========== 游戏状态 ========== */
let bird, pipes, particles, score, bestScore, frame, state;
// state: 'ready' | 'playing' | 'dead'
bestScore = parseInt(localStorage.getItem('flappy_best') || '0');
document.getElementById('best').textContent = bestScore;

function resetGame() {
  DIFF = DIFFS[diffIdx];
  bird = { x: 80, y: H / 2 - 40, vy: 0, r: 16, angle: 0, wingPhase: 0, alive: true };
  pipes = [];
  particles = [];
  score = 0;
  frame = 0;
  state = 'ready';
  document.getElementById('score').textContent = 0;
  document.getElementById('diff').textContent = DIFF.name;
}
resetGame();

/* ========== 输入 ========== */
let pressing = false;
function flap() {
  initAudio();
  if (state === 'ready') { state = 'playing'; }
  if (state === 'playing' && bird.alive) {
    bird.vy = FLAP_VEL;
    bird.wingPhase = 1;
    sfxFlap();
    // 羽毛粒子
    for (let i = 0; i < 3; i++) {
      particles.push({
        x: bird.x - 8, y: bird.y + 5,
        vx: -Math.random() * 2 - 1, vy: Math.random() * 2 - 1,
        life: 20 + Math.random() * 10,
        color: `hsl(${45 + Math.random()*20}, 90%, 70%)`,
        size: 2 + Math.random() * 2,
      });
    }
  }
  if (state === 'dead') {
    resetGame();
  }
}

cv.addEventListener('pointerdown', e => { e.preventDefault(); pressing = true; flap(); });
cv.addEventListener('pointerup', () => pressing = false);
cv.addEventListener('pointerleave', () => pressing = false);
document.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); pressing = true; flap(); }
});
document.addEventListener('keyup', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp') pressing = false;
});

/* ========== 管道生成 ========== */
function spawnPipe() {
  const minTop = 60;
  const maxTop = H - GROUND_H - DIFF.gap - 60;
  const topH = minTop + Math.random() * (maxTop - minTop);
  pipes.push({
    x: W + 10,
    topH: topH,
    botY: topH + DIFF.gap,
    scored: false,
    color: `hsl(${120 + Math.random()*40}, 60%, 40%)`,
  });
}

/* ========== 碰撞检测 ========== */
function checkCollision() {
  // 地面 / 天花板
  if (bird.y + bird.r > H - GROUND_H) { bird.y = H - GROUND_H - bird.r; return true; }
  if (bird.y - bird.r < 0) { bird.y = bird.r; return true; }
  // 管道
  for (const p of pipes) {
    if (bird.x + bird.r > p.x && bird.x - bird.r < p.x + PIPE_W) {
      if (bird.y - bird.r < p.topH || bird.y + bird.r > p.botY) {
        return true;
      }
    }
  }
  return false;
}

/* ========== 粒子 ========== */
function spawnDeathParticles() {
  for (let i = 0; i < 25; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 2 + Math.random() * 4;
    particles.push({
      x: bird.x, y: bird.y,
      vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
      life: 30 + Math.random() * 20,
      color: `hsl(${Math.random()*60}, 90%, 60%)`,
      size: 2 + Math.random() * 4,
    });
  }
}

/* ========== 绘制 ========== */

// 背景渐变（天空）
function drawBg() {
  const grad = ctx.createLinearGradient(0, 0, 0, H - GROUND_H);
  grad.addColorStop(0, '#4dc9f6');
  grad.addColorStop(0.5, '#87ceeb');
  grad.addColorStop(1, '#b6e3f4');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H - GROUND_H);

  // 云朵
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  const cloudOffset = (frame * 0.3) % (W + 200);
  for (let i = 0; i < 4; i++) {
    const cx = ((i * 130 + 50) - cloudOffset + W + 200) % (W + 200) - 100;
    const cy = 50 + i * 60 + Math.sin(i * 2.1) * 30;
    drawCloud(cx, cy, 0.5 + i * 0.15);
  }
}

function drawCloud(x, y, s) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(s, s);
  ctx.beginPath();
  ctx.arc(0, 0, 30, 0, Math.PI * 2);
  ctx.arc(25, -5, 25, 0, Math.PI * 2);
  ctx.arc(50, 0, 30, 0, Math.PI * 2);
  ctx.arc(15, 10, 20, 0, Math.PI * 2);
  ctx.arc(35, 10, 22, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

// 地面
function drawGround() {
  const gy = H - GROUND_H;
  // 泥土
  ctx.fillStyle = '#8B7355';
  ctx.fillRect(0, gy, W, GROUND_H);
  // 草地
  const grassGrad = ctx.createLinearGradient(0, gy, 0, gy + 18);
  grassGrad.addColorStop(0, '#4CAF50');
  grassGrad.addColorStop(1, '#388E3C');
  ctx.fillStyle = grassGrad;
  ctx.fillRect(0, gy, W, 18);
  // 草纹
  ctx.strokeStyle = '#66BB6A';
  ctx.lineWidth = 1.5;
  const gOff = (frame * DIFF.speed) % 20;
  for (let x = -gOff; x < W; x += 20) {
    ctx.beginPath();
    ctx.moveTo(x, gy + 2);
    ctx.lineTo(x + 5, gy - 5);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x + 10, gy + 2);
    ctx.lineTo(x + 14, gy - 3);
    ctx.stroke();
  }
}

// 管道
function drawPipe(p) {
  const capH = 24, capExtra = 6;
  // 上管道
  const topGrad = ctx.createLinearGradient(p.x, 0, p.x + PIPE_W, 0);
  topGrad.addColorStop(0, '#3d8b37');
  topGrad.addColorStop(0.3, '#5cb85c');
  topGrad.addColorStop(0.7, '#4CAF50');
  topGrad.addColorStop(1, '#2d6e27');
  ctx.fillStyle = topGrad;
  ctx.fillRect(p.x, 0, PIPE_W, p.topH);
  // 上管帽
  ctx.fillStyle = topGrad;
  ctx.fillRect(p.x - capExtra, p.topH - capH, PIPE_W + capExtra * 2, capH);
  ctx.strokeStyle = '#2d6e27';
  ctx.lineWidth = 2;
  ctx.strokeRect(p.x - capExtra, p.topH - capH, PIPE_W + capExtra * 2, capH);
  // 高光
  ctx.fillStyle = 'rgba(255,255,255,0.15)';
  ctx.fillRect(p.x + 6, 0, 8, p.topH - capH);

  // 下管道
  const botGrad = ctx.createLinearGradient(p.x, 0, p.x + PIPE_W, 0);
  botGrad.addColorStop(0, '#3d8b37');
  botGrad.addColorStop(0.3, '#5cb85c');
  botGrad.addColorStop(0.7, '#4CAF50');
  botGrad.addColorStop(1, '#2d6e27');
  ctx.fillStyle = botGrad;
  ctx.fillRect(p.x, p.botY, PIPE_W, H - GROUND_H - p.botY);
  // 下管帽
  ctx.fillStyle = botGrad;
  ctx.fillRect(p.x - capExtra, p.botY, PIPE_W + capExtra * 2, capH);
  ctx.strokeStyle = '#2d6e27';
  ctx.lineWidth = 2;
  ctx.strokeRect(p.x - capExtra, p.botY, PIPE_W + capExtra * 2, capH);
  // 高光
  ctx.fillStyle = 'rgba(255,255,255,0.15)';
  ctx.fillRect(p.x + 6, p.botY + capH, 8, H - GROUND_H - p.botY - capH);
}

// 小鸟
function drawBird() {
  ctx.save();
  ctx.translate(bird.x, bird.y);
  // 角度（根据速度旋转）
  const targetAngle = Math.min(Math.max(bird.vy * 0.06, -0.5), Math.PI / 2 * 0.8);
  bird.angle += (targetAngle - bird.angle) * 0.15;
  ctx.rotate(bird.angle);

  const r = bird.r;

  // 身体
  const bodyGrad = ctx.createRadialGradient(-r*0.2, -r*0.2, r*0.1, 0, 0, r);
  bodyGrad.addColorStop(0, '#ffe066');
  bodyGrad.addColorStop(0.7, '#f0c040');
  bodyGrad.addColorStop(1, '#d4a020');
  ctx.fillStyle = bodyGrad;
  ctx.beginPath();
  ctx.ellipse(0, 0, r, r * 0.85, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#b8860b';
  ctx.lineWidth = 1;
  ctx.stroke();

  // 翅膀
  const wingY = bird.wingPhase > 0 ? -6 : 3;
  bird.wingPhase = Math.max(0, bird.wingPhase - 0.15);
  ctx.fillStyle = '#e8b830';
  ctx.beginPath();
  ctx.ellipse(-4, wingY, 10, 5, -0.3, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#c89820';
  ctx.lineWidth = 0.8;
  ctx.stroke();

  // 眼睛
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(6, -4, 5.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#222';
  ctx.beginPath();
  ctx.arc(7.5, -3.5, 2.5, 0, Math.PI * 2);
  ctx.fill();
  // 眼睛高光
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(8.5, -4.5, 1, 0, Math.PI * 2);
  ctx.fill();

  // 嘴巴
  ctx.fillStyle = '#e74c3c';
  ctx.beginPath();
  ctx.moveTo(r - 2, -1);
  ctx.lineTo(r + 8, 1);
  ctx.lineTo(r - 2, 4);
  ctx.closePath();
  ctx.fill();

  // 腮红
  ctx.fillStyle = 'rgba(255,120,100,0.3)';
  ctx.beginPath();
  ctx.ellipse(3, 4, 4, 2.5, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

// 粒子
function drawParticles() {
  for (const p of particles) {
    const alpha = p.life / 40;
    ctx.globalAlpha = Math.min(1, alpha);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// 分数（游戏中大字体）
function drawScoreBig() {
  if (state !== 'playing') return;
  ctx.save();
  ctx.font = 'bold 48px "Segoe UI", sans-serif';
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.strokeStyle = 'rgba(0,0,0,0.2)';
  ctx.lineWidth = 3;
  ctx.strokeText(score, W / 2, 70);
  ctx.fillText(score, W / 2, 70);
  ctx.restore();
}

// 准备画面
function drawReady() {
  ctx.save();
  ctx.font = 'bold 36px "Segoe UI", sans-serif';
  ctx.textAlign = 'center';
  ctx.fillStyle = '#fff';
  ctx.shadowColor = 'rgba(0,0,0,0.3)';
  ctx.shadowBlur = 8;
  ctx.fillText('Flappy Bird', W / 2, H / 2 - 80);
  ctx.font = '18px "Segoe UI", sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.fillText('点击 / 空格 开始', W / 2, H / 2 - 40);

  // 小鸟浮动动画
  const floatY = Math.sin(frame * 0.05) * 8;
  bird.y = H / 2 + floatY;
  ctx.restore();
}

// 死亡画面
function drawDead() {
  ctx.save();
  // 半透明遮罩
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = 'center';
  ctx.shadowColor = 'rgba(0,0,0,0.4)';
  ctx.shadowBlur = 6;

  ctx.font = 'bold 40px "Segoe UI", sans-serif';
  ctx.fillStyle = '#ff6b6b';
  ctx.fillText('Game Over', W / 2, H / 2 - 60);

  ctx.font = '22px "Segoe UI", sans-serif';
  ctx.fillStyle = '#feca57';
  ctx.fillText(`得分: ${score}`, W / 2, H / 2 - 15);

  if (score >= bestScore && score > 0) {
    ctx.font = 'bold 18px "Segoe UI", sans-serif';
    ctx.fillStyle = '#ff9ff3';
    ctx.fillText('🎉 新纪录！', W / 2, H / 2 + 18);
  }

  ctx.font = '16px "Segoe UI", sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  ctx.fillText('点击重新开始', W / 2, H / 2 + 55);

  // 难度切换提示
  ctx.font = '14px "Segoe UI", sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.4)';
  ctx.fillText(`当前难度: ${DIFF.name}`, W / 2, H / 2 + 85);

  ctx.restore();
}

/* ========== 更新 ========== */
function update() {
  if (state !== 'playing') return;

  // 长按持续扇翅膀（减弱力度）
  if (pressing && bird.vy > -2) {
    bird.vy += FLAP_VEL * 0.15;
  }

  // 物理
  bird.vy += DIFF.gravity;
  bird.y += bird.vy;

  // 管道
  if (frame % DIFF.interval === 0) spawnPipe();
  for (const p of pipes) {
    p.x -= DIFF.speed;
    // 计分
    if (!p.scored && p.x + PIPE_W < bird.x) {
      p.scored = true;
      score++;
      document.getElementById('score').textContent = score;
      sfxScore();
    }
  }
  // 移除屏幕外管道
  while (pipes.length > 0 && pipes[0].x + PIPE_W < -10) pipes.shift();

  // 粒子
  for (const p of particles) {
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.05;
    p.life--;
  }
  while (particles.length > 0 && particles[0].life <= 0) particles.shift();

  // 碰撞
  if (checkCollision()) {
    bird.alive = false;
    state = 'dead';
    sfxHit();
    spawnDeathParticles();
    if (score > bestScore) {
      bestScore = score;
      localStorage.setItem('flappy_best', bestScore);
      document.getElementById('best').textContent = bestScore;
    }
  }
}

/* ========== 主循环 ========== */
function loop() {
  frame++;
  update();

  // 绘制
  drawBg();
  for (const p of pipes) drawPipe(p);
  drawGround();
  drawBird();
  drawParticles();
  drawScoreBig();

  if (state === 'ready') drawReady();
  if (state === 'dead') drawDead();

  requestAnimationFrame(loop);
}

// 难度切换（死亡画面按 D 键）
document.addEventListener('keydown', e => {
  if (e.code === 'KeyD' && state === 'dead') {
    diffIdx = (diffIdx + 1) % DIFFS.length;
    DIFF = DIFFS[diffIdx];
    document.getElementById('diff').textContent = DIFF.name;
  }
});

loop();
</script>
</body>
</html>
