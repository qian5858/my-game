<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>幸存者之夜</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Segoe UI',sans-serif;color:#e0e0e0;user-select:none;overflow:hidden}
.header{display:flex;gap:10px;margin-bottom:6px;font-size:.85rem;flex-wrap:wrap;justify-content:center}
.header .item{display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.06);padding:4px 12px;border-radius:16px}
.header .val{font-weight:bold;color:#feca57;min-width:24px;text-align:center}
.canvas-wrap{border:2px solid #2a2a4a;border-radius:10px;overflow:hidden;box-shadow:0 0 30px rgba(255,107,107,.1);position:relative}
canvas{display:block}
.overlay{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.7);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10}
.overlay h2{font-size:1.6rem;margin-bottom:10px;color:#feca57}
.upgrade-grid{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-width:500px}
.upgrade-card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:16px 20px;width:150px;text-align:center;cursor:pointer;transition:all .2s}
.upgrade-card:hover{border-color:#feca57;background:rgba(254,202,87,.08);transform:scale(1.05)}
.upgrade-card .icon{font-size:2rem;margin-bottom:6px}
.upgrade-card .name{font-weight:bold;color:#48dbfb;margin-bottom:4px;font-size:.9rem}
.upgrade-card .desc{font-size:.75rem;color:#889}
.tip{margin-top:4px;font-size:.7rem;color:#445}
</style>
</head>
<body>
<div class="header">
  <div class="item">❤️ HP <span class="val" id="hp">100</span></div>
  <div class="item">⭐ Lv <span class="val" id="lv">1</span></div>
  <div class="item">🏅 击杀 <span class="val" id="kills">0</span></div>
  <div class="item">⏱️ <span class="val" id="time">0:00</span></div>
  <div class="item">💎 经验 <span class="val" id="exp">0</span></div>
</div>
<div class="canvas-wrap">
  <canvas id="cv" width="500" height="400"></canvas>
  <div class="overlay" id="overlay" style="display:none">
    <h2 id="ov-title">选择升级</h2>
    <div class="upgrade-grid" id="upgrade-grid"></div>
  </div>
</div>
<div class="tip">WASD/方向键移动 · 自动攻击最近敌人 · 升级选技能</div>

<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const W=500,H=400;

const UPGRADES=[
  {icon:'🗡️',name:'攻击+20%',desc:'提升攻击伤害',apply:p=>p.dmg*=1.2},
  {icon:'⚡',name:'攻速+25%',desc:'缩短攻击间隔',apply:p=>p.atkSpeed*=0.75},
  {icon:'🏃',name:'移速+15%',desc:'移动更快',apply:p=>p.speed*=1.15},
  {icon:'❤️',name:'回复+30',desc:'恢复生命值',apply:p=>p.hp=Math.min(p.maxHp,p.hp+30)},
  {icon:'💪',name:'生命+20',desc:'增加最大生命',apply:p=>{p.maxHp+=20;p.hp+=20}},
  {icon:'🎯',name:'射程+30%',desc:'攻击范围更大',apply:p=>p.range*=1.3},
  {icon:'🌀',name:'弹幕+1',desc:'多发射一颗子弹',apply:p=>p.projCount++},
  {icon:'🛡️',name:'护甲+5',desc:'减少受到的伤害',apply:p=>p.armor+=5},
  {icon:'💥',name:'爆炸',desc:'子弹击中时爆炸',apply:p=>p.explosive=true},
  {icon:'🧲',name:'磁铁',desc:'自动吸取经验宝石',apply:p=>p.magnet=true},
  {icon:'🔥',name:'火焰',desc:'子弹附带灼烧',apply:p=>p.burn=true},
  {icon:'❄️',name:'冰冻',desc:'减速敌人',apply:p=>p.freeze=true},
];

let player,enemies,projectiles,xpGems,particles,kills,gameTime,gamePaused,gameOver;
let keys={};
let level,exp,nextExp;

function init(){
  player={x:W/2,y:H/2,hp:100,maxHp:100,speed:3,dmg:10,atkSpeed:500,range:150,
    projCount:1,armor:0,explosive:false,magnet:false,freeze:false,burn:false,
    lastAtk:0,invincible:0,r:12};
  enemies=[];projectiles=[];xpGems=[];particles=[];
  kills=0;gameTime=0;gamePaused=false;gameOver=false;
  level=1;exp=0;nextExp=10;
  document.getElementById('overlay').style.display='none';
  updateUI();
}

function spawnEnemy(){
  const side=Math.floor(Math.random()*4);
  let x,y;
  if(side===0){x=Math.random()*W;y=-20;}
  else if(side===1){x=W+20;y=Math.random()*H;}
  else if(side===2){x=Math.random()*W;y=H+20;}
  else{x=-20;y=Math.random()*H;}

  const minute=Math.floor(gameTime/60000);
  const types=[
    {hp:15+minute*5,speed:1+minute*0.1,r:10,color:'#e74c3c',dmg:8,exp:3},
    {hp:30+minute*10,speed:0.7+minute*0.05,r:14,color:'#9b59b6',dmg:12,exp:5},
    {hp:8+minute*3,speed:2+minute*0.15,r:7,color:'#e67e22',dmg:5,exp:2},
  ];
  const type=types[Math.floor(Math.random()*types.length)];
  enemies.push({...type,x,y,maxHp:type.hp,burnTimer:0,slowTimer:0});
}

function shoot(){
  if(!enemies.length)return;
  // Find closest enemy
  let closest=null,minDist=Infinity;
  for(const e of enemies){
    const d=Math.hypot(e.x-player.x,e.y-player.y);
    if(d<minDist){minDist=d;closest=e;}
  }
  if(!closest||minDist>player.range*2)return;

  const angle=Math.atan2(closest.y-player.y,closest.x-player.x);
  const spread=0.15;
  for(let i=0;i<player.projCount;i++){
    const a=angle+(i-(player.projCount-1)/2)*spread;
    projectiles.push({
      x:player.x,y:player.y,
      vx:Math.cos(a)*6,vy:Math.sin(a)*6,
      dmg:player.dmg,life:60,
      explosive:player.explosive,burn:player.burn,freeze:player.freeze,
      r:4
    });
  }
}

function addExp(amount){
  exp+=amount;
  while(exp>=nextExp){
    exp-=nextExp;
    level++;
    nextExp=Math.floor(nextExp*1.4);
    showUpgrade();
  }
}

function showUpgrade(){
  gamePaused=true;
  const grid=document.getElementById('upgrade-grid');
  grid.innerHTML='';
  // Pick 3 random upgrades
  const choices=[];
  const pool=[...UPGRADES];
  for(let i=0;i<3&&pool.length;i++){
    const idx=Math.floor(Math.random()*pool.length);
    choices.push(pool.splice(idx,1)[0]);
  }
  choices.forEach(u=>{
    const card=document.createElement('div');
    card.className='upgrade-card';
    card.innerHTML=`<div class="icon">${u.icon}</div><div class="name">${u.name}</div><div class="desc">${u.desc}</div>`;
    card.onclick=()=>{u.apply(player);gamePaused=false;document.getElementById('overlay').style.display='none';};
    grid.appendChild(card);
  });
  document.getElementById('overlay').style.display='flex';
}

function updateUI(){
  document.getElementById('hp').textContent=Math.ceil(player.hp);
  document.getElementById('lv').textContent=level;
  document.getElementById('kills').textContent=kills;
  const sec=Math.floor(gameTime/1000);
  document.getElementById('time').textContent=`${Math.floor(sec/60)}:${(sec%60).toString().padStart(2,'0')}`;
  document.getElementById('exp').textContent=`${exp}/${nextExp}`;
}

function spawnParticles(x,y,color,count=6){
  for(let i=0;i<count;i++){
    const angle=Math.random()*Math.PI*2;
    const speed=1+Math.random()*3;
    particles.push({x,y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,life:20+Math.random()*15,color,r:2+Math.random()*2});
  }
}

let lastTime=0,spawnTimer=0;
function gameLoop(time){
  const dt=Math.min(time-lastTime,50);lastTime=time;
  if(!gamePaused&&!gameOver){
    gameTime+=dt;
    // Input
    let dx=0,dy=0;
    if(keys['ArrowLeft']||keys['KeyA'])dx--;
    if(keys['ArrowRight']||keys['KeyD'])dx++;
    if(keys['ArrowUp']||keys['KeyW'])dy--;
    if(keys['ArrowDown']||keys['KeyS'])dy++;
    if(dx||dy){const len=Math.hypot(dx,dy);dx/=len;dy/=len;}
    player.x+=dx*player.speed;player.y+=dy*player.speed;
    player.x=Math.max(player.r,Math.min(W-player.r,player.x));
    player.y=Math.max(player.r,Math.min(H-player.r,player.y));
    if(player.invincible>0)player.invincible-=dt;

    // Spawn enemies
    spawnTimer+=dt;
    const spawnRate=Math.max(200,1000-gameTime/100);
    if(spawnTimer>=spawnRate){spawnTimer=0;spawnEnemy();}

    // Auto attack
    if(time-player.lastAtk>=player.atkSpeed){player.lastAtk=time;shoot();}

    // Update projectiles
    for(let i=projectiles.length-1;i>=0;i--){
      const p=projectiles[i];
      p.x+=p.vx;p.y+=p.vy;p.life--;
      if(p.life<=0||p.x<-20||p.x>W+20||p.y<-20||p.y>H+20){projectiles.splice(i,1);continue;}
      // Hit enemy
      for(let j=enemies.length-1;j>=0;j--){
        const e=enemies[j];
        if(Math.hypot(p.x-e.x,p.y-e.y)<p.r+e.r){
          e.hp-=p.dmg;
          if(p.burn)e.burnTimer=120;
          if(p.freeze)e.slowTimer=90;
          if(p.explosive){
            spawnParticles(p.x,p.y,'#f39c12',10);
            for(const e2 of enemies){
              if(e2!==e&&Math.hypot(p.x-e2.x,p.y-e2.y)<50)e2.hp-=p.dmg*0.5;
            }
          }
          spawnParticles(p.x,p.y,'#feca57',3);
          projectiles.splice(i,1);
          break;
        }
      }
    }

    // Update enemies
    for(let i=enemies.length-1;i>=0;i--){
      const e=enemies[i];
      if(e.hp<=0){
        kills++;
        spawnParticles(e.x,e.y,e.color,8);
        xpGems.push({x:e.x,y:e.y,exp:e.exp,r:4,life:300});
        enemies.splice(i,1);continue;
      }
      // Burn damage
      if(e.burnTimer>0){e.burnTimer--;e.hp-=0.3;}
      // Move toward player
      const angle=Math.atan2(player.y-e.y,player.x-e.x);
      let spd=e.speed;
      if(e.slowTimer>0){e.slowTimer--;spd*=0.4;}
      e.x+=Math.cos(angle)*spd;e.y+=Math.sin(angle)*spd;
      // Hit player
      if(Math.hypot(player.x-e.x,player.y-e.y)<player.r+e.r){
        if(player.invincible<=0){
          player.hp-=Math.max(1,e.dmg-player.armor);
          player.invincible=500;
          spawnParticles(player.x,player.y,'#e74c3c',5);
        }
      }
    }

    // XP gems
    for(let i=xpGems.length-1;i>=0;i--){
      const g=xpGems[i];
      g.life--;
      if(g.life<=0){xpGems.splice(i,1);continue;}
      const dist=Math.hypot(player.x-g.x,player.y-g.y);
      if(player.magnet&&dist<120){
        const angle=Math.atan2(player.y-g.y,player.x-g.x);
        g.x+=Math.cos(angle)*4;g.y+=Math.sin(angle)*4;
      }
      if(dist<player.r+g.r){
        addExp(g.exp);xpGems.splice(i,1);
      }
    }

    // Particles
    for(let i=particles.length-1;i>=0;i--){
      const p=particles[i];
      p.x+=p.vx;p.y+=p.vy;p.vx*=0.95;p.vy*=0.95;p.life--;
      if(p.life<=0)particles.splice(i,1);
    }

    // Death
    if(player.hp<=0){
      gameOver=true;
      document.getElementById('ov-title').textContent='游戏结束';
      document.getElementById('upgrade-grid').innerHTML=`<p style="color:#aab">击杀: ${kills} · 存活: ${Math.floor(gameTime/1000)}秒 · 等级: ${level}</p><button class="upgrade-card" onclick="init()" style="width:auto"><div class="name">再来一局</div></button>`;
      document.getElementById('overlay').style.display='flex';
    }

    updateUI();
  }

  // Draw
  ctx.fillStyle='#0d1117';ctx.fillRect(0,0,W,H);
  // Grid
  ctx.strokeStyle='rgba(255,255,255,.02)';ctx.lineWidth=1;
  for(let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=0;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}

  // XP gems
  xpGems.forEach(g=>{
    ctx.fillStyle='#48dbfb';ctx.globalAlpha=g.life<60?g.life/60:1;
    ctx.beginPath();ctx.arc(g.x,g.y,g.r,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=1;
  });

  // Enemies
  enemies.forEach(e=>{
    ctx.fillStyle=e.color;
    ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,Math.PI*2);ctx.fill();
    if(e.burnTimer>0){ctx.fillStyle='rgba(255,100,0,.3)';ctx.beginPath();ctx.arc(e.x,e.y,e.r+3,0,Math.PI*2);ctx.fill();}
    if(e.slowTimer>0){ctx.fillStyle='rgba(100,200,255,.3)';ctx.beginPath();ctx.arc(e.x,e.y,e.r+3,0,Math.PI*2);ctx.fill();}
    // HP bar
    if(e.hp<e.maxHp){
      ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(e.x-e.r,e.y-e.r-6,e.r*2,3);
      ctx.fillStyle='#2ecc71';ctx.fillRect(e.x-e.r,e.y-e.r-6,e.r*2*(e.hp/e.maxHp),3);
    }
  });

  // Projectiles
  projectiles.forEach(p=>{
    ctx.fillStyle=p.burn?'#e74c3c':p.freeze?'#48dbfb':'#feca57';
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.3)';
    ctx.beginPath();ctx.arc(p.x-1,p.y-1,p.r*0.4,0,Math.PI*2);ctx.fill();
  });

  // Player
  const blink=player.invincible>0&&Math.floor(player.invincible/50)%2;
  if(!blink){
    ctx.fillStyle='#48dbfb';
    ctx.shadowColor='rgba(72,219,251,.4)';ctx.shadowBlur=10;
    ctx.beginPath();ctx.arc(player.x,player.y,player.r,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;
    // Face
    ctx.fillStyle='#fff';
    ctx.beginPath();ctx.arc(player.x-3,player.y-2,2.5,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(player.x+3,player.y-2,2.5,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#222';
    ctx.beginPath();ctx.arc(player.x-3,player.y-2,1.2,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(player.x+3,player.y-2,1.2,0,Math.PI*2);ctx.fill();
  }

  // Range indicator
  ctx.strokeStyle='rgba(72,219,251,.08)';ctx.lineWidth=1;
  ctx.beginPath();ctx.arc(player.x,player.y,player.range,0,Math.PI*2);ctx.stroke();

  // Particles
  particles.forEach(p=>{
    ctx.globalAlpha=p.life/30;ctx.fillStyle=p.color;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=1;
  });

  requestAnimationFrame(gameLoop);
}

document.addEventListener('keydown',e=>{keys[e.code]=true;e.preventDefault();});
document.addEventListener('keyup',e=>{keys[e.code]=false;});

init();
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
