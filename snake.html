<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>贪吃蛇大作战</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:linear-gradient(180deg,#0a0a1a,#1a1a2e);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Segoe UI',sans-serif;color:#e0e0e0;user-select:none;overflow:hidden}
.header{display:flex;gap:12px;margin-bottom:6px;font-size:.9rem;flex-wrap:wrap;justify-content:center}
.header .item{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.06);padding:5px 14px;border-radius:20px}
.header .val{font-weight:bold;color:#feca57;min-width:24px;text-align:center}
.canvas-wrap{border:2px solid #2a2a4a;border-radius:10px;overflow:hidden;box-shadow:0 0 30px rgba(72,219,251,.08);position:relative}
canvas{display:block}
.toolbar{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap;justify-content:center}
.mode-btn,.skin-btn{padding:6px 14px;border:1px solid rgba(255,255,255,.15);border-radius:8px;background:rgba(255,255,255,.05);color:#aab;cursor:pointer;font-size:.8rem;transition:all .2s;font-family:inherit}
.mode-btn:hover,.skin-btn:hover{background:rgba(255,255,255,.12)}
.mode-btn.active{border-color:#48dbfb;background:rgba(72,219,251,.15);color:#48dbfb}
.skin-btn.active{border-color:#ff6b6b;background:rgba(255,107,107,.15);color:#ff6b6b}
.tip{margin-top:4px;font-size:.7rem;color:#445;text-align:center}
.overlay{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.65);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10}
.overlay h2{font-size:1.8rem;margin-bottom:6px}
.overlay p{color:#aab;margin-bottom:12px;font-size:.95rem}
.overlay .btn{padding:10px 28px;border:none;border-radius:10px;font-size:1rem;font-weight:bold;cursor:pointer;background:linear-gradient(135deg,#48dbfb,#0abde3);color:#0a1628}
.powerup-info{font-size:.75rem;color:#667;margin-top:4px}
</style>
</head>
<body>
<div class="header">
  <div class="item">🏅 分数 <span class="val" id="score">0</span></div>
  <div class="item">🏆 最高 <span class="val" id="best">0</span></div>
  <div class="item">⚡ 速度 <span class="val" id="speed">1</span></div>
  <div class="item">🎯 模式 <span class="val" id="mode-name">经典</span></div>
</div>
<div class="canvas-wrap">
  <canvas id="cv" width="400" height="400"></canvas>
  <div class="overlay" id="overlay" style="display:none">
    <h2 id="ov-title">Game Over</h2>
    <p id="ov-msg">分数: 0</p>
    <button class="btn" onclick="restart()">再来一局</button>
  </div>
</div>
<div class="toolbar">
  <button class="mode-btn active" data-mode="classic" onclick="setMode('classic',this)">🎮 经典</button>
  <button class="mode-btn" data-mode="portal" onclick="setMode('portal',this)">🌀 传送门</button>
  <button class="mode-btn" data-mode="speed" onclick="setMode('speed',this)">⚡ 极速</button>
  <button class="mode-btn" data-mode="maze" onclick="setMode('maze',this)">🧱 迷宫</button>
</div>
<div class="toolbar">
  <button class="skin-btn active" data-skin="0" onclick="setSkin(0,this)">🐍 翠绿</button>
  <button class="skin-btn" data-skin="1" onclick="setSkin(1,this)">🔥 烈焰</button>
  <button class="skin-btn" data-skin="2" onclick="setSkin(2,this)">💎 冰蓝</button>
  <button class="skin-btn" data-skin="3" onclick="setSkin(3,this)">🌸 樱花</button>
</div>
<div class="powerup-info">🍎普通食物 · ⭐加速星 · 🛡️护盾 · 💣炸弹(避开) · 🧲磁铁(吸食物)</div>
<div class="tip">方向键/WASD 控制 · 空格暂停</div>

<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const W=400,H=400,CELL=20,COLS=W/CELL,ROWS=H/CELL;
const SKINS=[
  {head:'#2ecc71',body:'#27ae60',glow:'rgba(46,204,113,.3)',eye:'#fff'},
  {head:'#e74c3c',body:'#c0392b',glow:'rgba(231,76,60,.3)',eye:'#feca57'},
  {head:'#3498db',body:'#2980b9',glow:'rgba(52,152,219,.3)',eye:'#fff'},
  {head:'#ff9ff3',body:'#f368e0',glow:'rgba(255,159,243,.3)',eye:'#fff'},
];

let snake,dir,nextDir,food,powerups,score,best,gameOver,paused,mode,skin;
let walls=[],portals=[];
let shield=false,speedBoost=0,magnet=0;
let baseInterval=120,interval,timer;
best=parseInt(localStorage.getItem('snake_best')||'0');
document.getElementById('best').textContent=best;

function init(){
  snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];
  dir={x:1,y:0};nextDir={x:1,y:0};
  food=null;powerups=[];score=0;gameOver=false;paused=false;
  shield=false;speedBoost=0;magnet=0;
  walls=[];portals=[];
  document.getElementById('overlay').style.display='none';
  document.getElementById('score').textContent=0;
  updateSpeed();
  spawnFood();
  if(mode==='maze')generateMaze();
  if(mode==='portal')generatePortals();
  if(timer)clearInterval(timer);
  timer=setInterval(tick,interval);
}

function updateSpeed(){
  let spd=1;
  if(mode==='speed')spd=2+Math.floor(score/5);
  else spd=1+Math.floor(score/10);
  document.getElementById('speed').textContent=spd;
  interval=Math.max(50,baseInterval-spd*8-(speedBoost>0?30:0));
  if(timer){clearInterval(timer);timer=setInterval(tick,interval);}
}

function generateMaze(){
  walls=[];
  // Generate some wall blocks
  for(let i=0;i<8;i++){
    const sx=3+Math.floor(Math.random()*(COLS-6));
    const sy=3+Math.floor(Math.random()*(ROWS-6));
    const horizontal=Math.random()>.5;
    const len=3+Math.floor(Math.random()*3);
    for(let j=0;j<len;j++){
      const wx=horizontal?sx+j:sx;
      const wy=horizontal?sy:sy+j;
      if(wx>0&&wx<COLS-1&&wy>0&&wy<ROWS-1)walls.push({x:wx,y:wy});
    }
  }
}

function generatePortals(){
  portals=[
    {x:2,y:2,partner:1},{x:COLS-3,y:ROWS-3,partner:0},
    {x:2,y:ROWS-3,partner:3},{x:COLS-3,y:2,partner:2},
  ];
}

function isOccupied(x,y){
  if(snake.some(s=>s.x===x&&s.y===y))return true;
  if(food&&food.x===x&&food.y===y)return true;
  if(walls.some(w=>w.x===x&&w.y===y))return true;
  if(powerups.some(p=>p.x===x&&p.y===y))return true;
  return false;
}

function spawnFood(){
  let x,y;
  do{x=Math.floor(Math.random()*COLS);y=Math.floor(Math.random()*ROWS);}while(isOccupied(x,y));
  food={x,y};
}

function spawnPowerup(){
  if(powerups.length>=2)return;
  if(Math.random()>0.3)return;
  const types=['star','shield','bomb','magnet'];
  const type=types[Math.floor(Math.random()*types.length)];
  let x,y;
  do{x=Math.floor(Math.random()*COLS);y=Math.floor(Math.random()*ROWS);}while(isOccupied(x,y));
  powerups.push({x,y,type,life:200});
}

function tick(){
  if(gameOver||paused)return;
  dir={...nextDir};
  let nx=snake[0].x+dir.x,ny=snake[0].y+dir.y;

  // Portal
  if(mode==='portal'){
    const portal=portals.find(p=>p.x===nx&&p.y===ny);
    if(portal){
      const dest=portals.find(p=>p.x===portals[portal.partner].x&&p.y===portals[portal.partner].y);
      const other=portals[portal.partner];
      nx=other.x+dir.x;ny=other.y+dir.y;
    }
  }

  // Wall wrap (classic/speed) or collision
  if(mode==='classic'||mode==='speed'){
    if(nx<0)nx=COLS-1;if(nx>=COLS)nx=0;
    if(ny<0)ny=ROWS-1;if(ny>=ROWS)ny=0;
  }else{
    if(nx<0||nx>=COLS||ny<0||ny>=ROWS){die();return;}
  }

  // Wall collision
  if(walls.some(w=>w.x===nx&&w.y===ny)){
    if(!shield){die();return;}
    shield=false;
  }

  // Self collision
  if(snake.some(s=>s.x===nx&&s.y===ny)){
    if(!shield){die();return;}
    shield=false;
  }

  snake.unshift({x:nx,y:ny});

  // Eat food
  let ate=false;
  if(food&&nx===food.x&&ny===food.y){
    score++;ate=true;
    document.getElementById('score').textContent=score;
    spawnFood();spawnPowerup();updateSpeed();
  }

  // Magnet effect
  if(magnet>0){
    magnet--;
    // Move food closer
    if(food){
      const dx=snake[0].x-food.x,dy=snake[0].y-food.y;
      if(Math.abs(dx)+Math.abs(dy)>1){
        food.x+=Math.sign(dx);food.y+=Math.sign(dy);
      }
    }
  }

  // Powerup collision
  for(let i=powerups.length-1;i>=0;i--){
    const p=powerups[i];
    if(nx===p.x&&ny===p.y){
      if(p.type==='star'){score+=3;speedBoost=50;document.getElementById('score').textContent=score;updateSpeed();}
      else if(p.type==='shield'){shield=true;}
      else if(p.type==='bomb'){die();return;}
      else if(p.type==='magnet'){magnet=80;}
      powerups.splice(i,1);
    }
  }

  if(!ate)snake.pop();

  // Decay powerup timers
  powerups.forEach(p=>p.life--);
  powerups=powerups.filter(p=>p.life>0);
  if(speedBoost>0)speedBoost--;
  if(speedBoost===0&&interval!==Math.max(50,baseInterval-(1+Math.floor(score/10))*8))updateSpeed();
}

function die(){
  gameOver=true;
  if(score>best){best=score;localStorage.setItem('snake_best',best);document.getElementById('best').textContent=best;}
  document.getElementById('ov-title').textContent='Game Over';
  document.getElementById('ov-msg').textContent=`分数: ${score}`;
  document.getElementById('overlay').style.display='flex';
}

function restart(){init();}

function setMode(m,el){
  mode=m;
  document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('mode-name').textContent=el.textContent.replace(/^[^\s]+\s/,'');
  baseInterval=m==='speed'?80:120;
  init();
}

function setSkin(s,el){
  skin=s;
  document.querySelectorAll('.skin-btn').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
}

// Input
document.addEventListener('keydown',e=>{
  if(e.code==='Space'){paused=!paused;e.preventDefault();return;}
  const map={
    'ArrowUp':{x:0,y:-1},'ArrowDown':{x:0,y:1},'ArrowLeft':{x:-1,y:0},'ArrowRight':{x:1,y:0},
    'w':{x:0,y:-1},'s':{x:0,y:1},'a':{x:-1,y:0},'d':{x:1,y:0},
    'W':{x:0,y:-1},'S':{x:0,y:1},'A':{x:-1,y:0},'D':{x:1,y:0},
  };
  if(map[e.key]){
    e.preventDefault();
    const nd=map[e.key];
    if(nd.x!==-dir.x||nd.y!==-dir.y)nextDir=nd;
  }
});

// Touch
let tx,ty;
cv.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:true});
cv.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)<20&&Math.abs(dy)<20)return;
  let nd;
  if(Math.abs(dx)>Math.abs(dy))nd=dx>0?{x:1,y:0}:{x:-1,y:0};
  else nd=dy>0?{x:0,y:1}:{x:0,y:-1};
  if(nd.x!==-dir.x||nd.y!==-dir.y)nextDir=nd;
},{passive:true});

// Draw
function draw(){
  ctx.fillStyle='#0d1117';ctx.fillRect(0,0,W,H);

  // Grid
  ctx.strokeStyle='rgba(255,255,255,.03)';ctx.lineWidth=1;
  for(let x=0;x<=W;x+=CELL){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=0;y<=H;y+=CELL){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}

  // Walls
  walls.forEach(w=>{
    ctx.fillStyle='#4a4a6a';
    ctx.fillRect(w.x*CELL+1,w.y*CELL+1,CELL-2,CELL-2);
    ctx.strokeStyle='#5a5a7a';ctx.lineWidth=1;
    ctx.strokeRect(w.x*CELL+1,w.y*CELL+1,CELL-2,CELL-2);
  });

  // Portals
  portals.forEach((p,i)=>{
    const colors=['#48dbfb','#ff6b6b'];
    ctx.fillStyle=colors[i];
    ctx.beginPath();
    ctx.arc(p.x*CELL+CELL/2,p.y*CELL+CELL/2,CELL/2-2,0,Math.PI*2);
    ctx.fill();
    ctx.fillStyle='rgba(0,0,0,.3)';
    ctx.beginPath();
    ctx.arc(p.x*CELL+CELL/2,p.y*CELL+CELL/2,CELL/4,0,Math.PI*2);
    ctx.fill();
  });

  // Food
  if(food){
    const fx=food.x*CELL+CELL/2,fy=food.y*CELL+CELL/2;
    ctx.fillStyle='#e74c3c';
    ctx.beginPath();ctx.arc(fx,fy,CELL/2-2,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.3)';
    ctx.beginPath();ctx.arc(fx-2,fy-2,3,0,Math.PI*2);ctx.fill();
  }

  // Powerups
  powerups.forEach(p=>{
    const px=p.x*CELL+CELL/2,py=p.y*CELL+CELL/2;
    const pulse=Math.sin(Date.now()/200)*2;
    const icons={star:'⭐',shield:'🛡️',bomb:'💣',magnet:'🧲'};
    ctx.font=`${14+pulse}px serif`;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(icons[p.type],px,py);
  });

  // Snake
  const sk=SKINS[skin];
  snake.forEach((s,i)=>{
    const x=s.x*CELL,y=s.y*CELL;
    if(i===0){
      // Head
      ctx.fillStyle=sk.head;
      ctx.shadowColor=sk.glow;ctx.shadowBlur=8;
      ctx.beginPath();
      ctx.roundRect(x+1,y+1,CELL-2,CELL-2,5);
      ctx.fill();
      ctx.shadowBlur=0;
      // Eyes
      ctx.fillStyle=sk.eye;
      const ex1=x+CELL/2+dir.x*4-dir.y*3;
      const ey1=y+CELL/2+dir.y*4-dir.x*3;
      const ex2=x+CELL/2+dir.x*4+dir.y*3;
      const ey2=y+CELL/2+dir.y*4+dir.x*3;
      ctx.beginPath();ctx.arc(ex1,ey1,2.5,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(ex2,ey2,2.5,0,Math.PI*2);ctx.fill();
      // Shield indicator
      if(shield){
        ctx.strokeStyle='rgba(72,219,251,.6)';ctx.lineWidth=2;
        ctx.beginPath();ctx.arc(x+CELL/2,y+CELL/2,CELL/2+1,0,Math.PI*2);ctx.stroke();
      }
    }else{
      const alpha=1-i/snake.length*0.4;
      ctx.globalAlpha=alpha;
      ctx.fillStyle=sk.body;
      ctx.beginPath();
      ctx.roundRect(x+2,y+2,CELL-4,CELL-4,4);
      ctx.fill();
      ctx.globalAlpha=1;
    }
  });

  // Speed boost effect
  if(speedBoost>0){
    ctx.fillStyle=`rgba(254,202,87,${0.05+Math.sin(Date.now()/100)*0.03})`;
    ctx.fillRect(0,0,W,H);
  }

  // Pause
  if(paused&&!gameOver){
    ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(0,0,W,H);
    ctx.font='bold 30px sans-serif';ctx.textAlign='center';ctx.fillStyle='#fff';
    ctx.fillText('暂停',W/2,H/2);
  }

  requestAnimationFrame(draw);
}

mode='classic';skin=0;
init();draw();
</script>
</body>
</html>
