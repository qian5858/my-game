<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>钓鱼大师</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:linear-gradient(180deg,#0a1628,#1a2a4a);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Segoe UI',sans-serif;color:#e0e0e0;user-select:none;overflow:hidden}
.header{display:flex;gap:10px;margin-bottom:6px;font-size:.85rem;flex-wrap:wrap;justify-content:center}
.header .item{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.06);padding:5px 14px;border-radius:20px}
.header .val{font-weight:bold;color:#feca57;min-width:24px;text-align:center}
.canvas-wrap{border:2px solid #2a2a4a;border-radius:10px;overflow:hidden;box-shadow:0 0 30px rgba(72,219,251,.08);position:relative}
canvas{display:block;cursor:pointer}
.overlay{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10}
.overlay h2{font-size:1.4rem;margin-bottom:8px;color:#feca57}
.overlay p{color:#aab;margin-bottom:10px;font-size:.9rem;text-align:center;max-width:300px}
.overlay .btn{padding:10px 28px;border:none;border-radius:10px;font-size:1rem;font-weight:bold;cursor:pointer;background:linear-gradient(135deg,#48dbfb,#0abde3);color:#0a1628}
.tip{margin-top:4px;font-size:.7rem;color:#445}
.collection{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;margin-top:4px;max-width:500px}
.fish-tag{padding:3px 8px;border-radius:6px;font-size:.75rem;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1)}
.fish-tag.caught{border-color:#2ecc71;background:rgba(46,204,113,.1);color:#2ecc71}
.fish-tag.unknown{color:#556}
</style>
</head>
<body>
<div class="header">
  <div class="item">🐟 已收集 <span class="val" id="caught">0</span>/<span id="total">0</span></div>
  <div class="item">💰 金币 <span class="val" id="coins">0</span></div>
  <div class="item">🎣 等级 <span class="val" id="lv">1</span></div>
  <div class="item">🏆 最大 <span class="val" id="biggest">0</span>cm</div>
</div>
<div class="canvas-wrap">
  <canvas id="cv" width="500" height="400"></canvas>
  <div class="overlay" id="overlay">
    <h2 id="ov-title">🎣 钓鱼大师</h2>
    <p id="ov-msg">点击抛竿，看准时机收钩！</p>
    <button class="btn" onclick="startGame()">开始钓鱼</button>
  </div>
</div>
<div class="collection" id="collection"></div>
<div class="tip">点击抛竿 → 鱼靠近时点击收钩 → 收集所有鱼类！</div>

<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const W=500,H=400;
const WATER_Y=120;

const FISH_TYPES=[
  {emoji:'🐟',name:'小丑鱼',color:'#e67e22',minSize:8,maxSize:15,speed:1.5,depth:[140,200],rarity:1,value:5},
  {emoji:'🐠',name:'热带鱼',color:'#3498db',minSize:10,maxSize:18,speed:1.2,depth:[160,240],rarity:1,value:8},
  {emoji:'🐡',name:'河豚',color:'#f1c40f',minSize:12,maxSize:20,speed:0.8,depth:[200,280],rarity:2,value:15},
  {emoji:'🦈',name:'鲨鱼',color:'#7f8c8d',minSize:25,maxSize:45,speed:2,depth:[250,350],rarity:3,value:50},
  {emoji:'🐙',name:'章鱼',color:'#9b59b6',minSize:15,maxSize:25,speed:0.6,depth:[220,320],rarity:2,value:20},
  {emoji:'🦑',name:'鱿鱼',color:'#e74c3c',minSize:12,maxSize:22,speed:1.8,depth:[200,300],rarity:2,value:18},
  {emoji:'🐳',name:'鲸鱼',color:'#2980b9',minSize:40,maxSize:60,speed:0.5,depth:[300,380],rarity:4,value:100},
  {emoji:'🦐',name:'虾',color:'#e74c3c',minSize:5,maxSize:10,speed:2.5,depth:[130,180],rarity:1,value:3},
  {emoji:'🦀',name:'螃蟹',color:'#c0392b',minSize:8,maxSize:14,speed:0.4,depth:[340,390],rarity:2,value:12},
  {emoji:'🐢',name:'海龟',color:'#27ae60',minSize:20,maxSize:35,speed:0.7,depth:[180,260],rarity:3,value:40},
  {emoji:'👑',name:'金鱼王',color:'#f1c40f',minSize:15,maxSize:25,speed:1,depth:[280,370],rarity:5,value:200},
];

let fishes,hook,state,coins,caughtTypes,biggest,lv,castTimer,waitTimer,catchAnim;
let frame=0;

document.getElementById('total').textContent=FISH_TYPES.length;

function startGame(){
  fishes=[];coins=0;caughtTypes=new Set();biggest=0;lv=1;
  state='idle';hook={x:250,y:WATER_Y-30,vy:0,targetY:0};
  castTimer=0;waitTimer=0;catchAnim=null;
  document.getElementById('overlay').style.display='none';
  spawnFishes();
  updateUI();
  renderCollection();
}

function spawnFishes(){
  fishes=[];
  const count=8+lv*2;
  for(let i=0;i<count;i++){
    const type=FISH_TYPES[Math.floor(Math.random()*Math.min(FISH_TYPES.length,3+lv))];
    const depth=type.depth;
    const y=depth[0]+Math.random()*(depth[1]-depth[0]);
    const size=type.minSize+Math.random()*(type.maxSize-type.minSize);
    const dir=Math.random()>.5?1:-1;
    fishes.push({
      x:dir>0?-30:W+30,y,size,dir,
      speed:type.speed*(0.8+Math.random()*0.4),
      type,wobble:Math.random()*Math.PI*2,
      nearHook:false,
    });
  }
}

function cast(){
  if(state!=='idle')return;
  state='casting';
  hook.x=150+Math.random()*200;
  hook.y=WATER_Y;
  hook.vy=2;
  hook.targetY=WATER_Y+80+Math.random()*200;
}

function reel(){
  if(state==='waiting'){
    // Check if any fish is near hook
    let caught=null;
    for(const f of fishes){
      const dist=Math.hypot(f.x-hook.x,f.y-hook.y);
      if(dist<f.size+20){
        caught=f;break;
      }
    }
    if(caught){
      state='catching';
      catchAnim={fish:caught,timer:30};
      const idx=FISH_TYPES.indexOf(caught.type);
      caughtTypes.add(idx);
      const size=Math.floor(caught.size);
      if(size>biggest)biggest=size;
      coins+=caught.type.value;
      lv=Math.floor(caughtTypes.size/2)+1;
    }else{
      state='reeling';
    }
  }else if(state==='casting'){
    state='reeling';
  }
}

function updateUI(){
  document.getElementById('caught').textContent=caughtTypes.size;
  document.getElementById('coins').textContent=coins;
  document.getElementById('lv').textContent=lv;
  document.getElementById('biggest').textContent=biggest;
}

function renderCollection(){
  const div=document.getElementById('collection');
  div.innerHTML='';
  FISH_TYPES.forEach((f,i)=>{
    const tag=document.createElement('span');
    tag.className='fish-tag '+(caughtTypes.has(i)?'caught':'unknown');
    tag.textContent=caughtTypes.has(i)?`${f.emoji}${f.name}`:'???';
    div.appendChild(tag);
  });
}

function update(){
  frame++;
  if(state==='idle')return;

  // Update fishes
  fishes.forEach(f=>{
    f.x+=f.speed*f.dir;
    f.wobble+=0.05;
    f.y+=Math.sin(f.wobble)*0.3;
    // Check near hook
    if(state==='waiting'){
      const dist=Math.hypot(f.x-hook.x,f.y-hook.y);
      if(dist<f.size+30)f.nearHook=true;
    }
  });
  // Remove off-screen fish and respawn
  fishes=fishes.filter(f=>f.x>-50&&f.x<W+50);
  while(fishes.length<5+lv){
    const type=FISH_TYPES[Math.floor(Math.random()*Math.min(FISH_TYPES.length,3+lv))];
    const depth=type.depth;
    const y=depth[0]+Math.random()*(depth[1]-depth[0]);
    const dir=Math.random()>.5?1:-1;
    fishes.push({x:dir>0?-30:W+30,y,size:type.minSize+Math.random()*(type.maxSize-type.minSize),dir,speed:type.speed*(0.8+Math.random()*0.4),type,wobble:Math.random()*Math.PI*2,nearHook:false});
  }

  if(state==='casting'){
    hook.y+=hook.vy;
    if(hook.y>=hook.targetY){
      state='waiting';waitTimer=120;
    }
  }else if(state==='waiting'){
    waitTimer--;
    // Fish attraction
    fishes.forEach(f=>{
      const dx=hook.x-f.x,dy=hook.y-f.y;
      const dist=Math.hypot(dx,dy);
      if(dist<100&&dist>0){
        f.x+=dx/dist*0.5;f.y+=dy/dist*0.3;
      }
    });
    if(waitTimer<=0)state='reeling';
  }else if(state==='reeling'){
    hook.y-=3;
    if(hook.y<=WATER_Y-30){state='idle';}
  }else if(state==='catching'){
    catchAnim.timer--;
    hook.y-=2;
    if(catchAnim.timer<=0){
      state='idle';
      spawnFishes();
      updateUI();renderCollection();
      if(caughtTypes.size>=FISH_TYPES.length){
        document.getElementById('ov-title').textContent='🎉 全收集！';
        document.getElementById('ov-msg').textContent=`恭喜钓到所有鱼类！金币: ${coins}`;
        document.getElementById('overlay').style.display='flex';
      }
    }
  }
}

function draw(){
  ctx.fillStyle='#0d1117';ctx.fillRect(0,0,W,H);

  // Sky
  const skyGrad=ctx.createLinearGradient(0,0,0,WATER_Y);
  skyGrad.addColorStop(0,'#1a1a3e');skyGrad.addColorStop(1,'#2a3a5e');
  ctx.fillStyle=skyGrad;ctx.fillRect(0,0,W,WATER_Y);

  // Sun/Moon
  ctx.fillStyle='#feca57';
  ctx.beginPath();ctx.arc(400,40,20,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='rgba(254,202,87,.1)';
  ctx.beginPath();ctx.arc(400,40,35,0,Math.PI*2);ctx.fill();

  // Water
  const waterGrad=ctx.createLinearGradient(0,WATER_Y,0,H);
  waterGrad.addColorStop(0,'#1a4a6a');waterGrad.addColorStop(0.5,'#0d2a4a');waterGrad.addColorStop(1,'#061a2a');
  ctx.fillStyle=waterGrad;ctx.fillRect(0,WATER_Y,W,H-WATER_Y);

  // Water surface waves
  ctx.strokeStyle='rgba(72,219,251,.2)';ctx.lineWidth=1;
  for(let x=0;x<W;x+=3){
    const y=WATER_Y+Math.sin((x+frame*2)*0.03)*3;
    ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+2,y);ctx.stroke();
  }

  // Bubbles
  ctx.fillStyle='rgba(72,219,251,.15)';
  for(let i=0;i<5;i++){
    const bx=(i*97+frame*0.5)%W;
    const by=WATER_Y+20+(frame*0.3+i*50)%(H-WATER_Y-20);
    ctx.beginPath();ctx.arc(bx,by,2+Math.sin(frame*0.05+i)*1,0,Math.PI*2);ctx.fill();
  }

  // Fishes
  fishes.forEach(f=>{
    ctx.save();ctx.translate(f.x,f.y);
    if(f.dir<0)ctx.scale(-1,1);
    const scale=f.size/15;
    ctx.scale(scale,scale);
    // Body
    ctx.fillStyle=f.type.color;
    ctx.beginPath();ctx.ellipse(0,0,15,8,0,0,Math.PI*2);ctx.fill();
    // Tail
    ctx.beginPath();ctx.moveTo(-15,0);ctx.lineTo(-22,-6);ctx.lineTo(-22,6);ctx.fill();
    // Eye
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(8,-2,3,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#222';ctx.beginPath();ctx.arc(9,-2,1.5,0,Math.PI*2);ctx.fill();
    // Highlight
    ctx.fillStyle='rgba(255,255,255,.2)';
    ctx.beginPath();ctx.ellipse(2,-4,6,2,0,0,Math.PI*2);ctx.fill();
    ctx.restore();
    // Near hook indicator
    if(f.nearHook&&state==='waiting'){
      ctx.fillStyle='rgba(46,204,113,.5)';
      ctx.beginPath();ctx.arc(f.x,f.y-f.size-8,4,0,Math.PI*2);ctx.fill();
    }
  });

  // Fishing rod
  ctx.strokeStyle='#8B7355';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(50,WATER_Y-60);ctx.lineTo(50,WATER_Y-10);ctx.stroke();
  ctx.strokeStyle='#aaa';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(50,WATER_Y-60);
  if(state!=='idle'){
    ctx.lineTo(hook.x,hook.y);ctx.stroke();
    // Hook
    ctx.strokeStyle='#ccc';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(hook.x,hook.y,5,0,Math.PI);ctx.stroke();
  }else{
    ctx.lineTo(60,WATER_Y-50);ctx.stroke();
  }

  // Catch animation
  if(state==='catching'&&catchAnim){
    const f=catchAnim.fish;
    const alpha=catchAnim.timer/30;
    ctx.globalAlpha=alpha;
    ctx.font='30px serif';ctx.textAlign='center';
    ctx.fillText(f.type.emoji,hook.x,hook.y-15);
    ctx.font='bold 14px sans-serif';ctx.fillStyle='#feca57';
    ctx.fillText(`+${f.type.value}💰`,hook.x,hook.y-35);
    ctx.globalAlpha=1;
  }

  // State indicator
  if(state==='waiting'){
    ctx.fillStyle='rgba(254,202,87,.6)';ctx.font='14px sans-serif';ctx.textAlign='center';
    const pulse=Math.sin(frame*0.1)*3;
    ctx.fillText('🎣 点击收钩！',hook.x,hook.y-20+pulse);
  }

  // Depth indicator
  ctx.fillStyle='rgba(255,255,255,.15)';ctx.font='10px sans-serif';ctx.textAlign='left';
  for(let d=150;d<H;d+=50){
    ctx.fillText(`${d-120}m`,5,d);
  }
}

function gameLoop(){
  update();draw();
  requestAnimationFrame(gameLoop);
}

cv.addEventListener('click',()=>{
  if(state==='idle')cast();
  else if(state==='waiting')reel();
});

state='idle';
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
